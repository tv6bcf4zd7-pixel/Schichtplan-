<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Schichtplan App</title>

<style>
:root {
  --bg:#F8F7F4;--bg2:#FFFFFF;--bg3:#F0EEE9;--text:#1A1917;--text2:#6B6860;--text3:#A8A59E;
  --border:#E2DED6;--border2:#C8C4BA;--accent:#2D5016;--accent-bg:#EAF3DE;
  --danger:#A32D2D;--danger-bg:#FCEBEB;--warn:#633806;--warn-bg:#FAEEDA;
  --info:#0C447C;--info-bg:#E6F1FB;--radius:10px;--radius-sm:6px;
  --col-og:#C0DD97;--col-spaet:#CECBF6;--col-blau:#B5D4F4;--col-gelb:#FAC775;--col-ft:#F5C4B3;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1A1917;--bg2:#252420;--bg3:#2E2C28;--text:#F0EDE6;--text2:#A8A59E;--text3:#6B6860;
  --border:#3A3830;--border2:#4A4840;--accent:#97C459;--accent-bg:#1A2E08;
  --danger:#E24B4A;--danger-bg:#2A0F0F;--warn:#EF9F27;--warn-bg:#2A1A04;--info:#378ADD;--info-bg:#041929;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;height:52px}
.nav-title{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw-ctrl{display:flex;align-items:center;gap:4px}
.kw-ctrl button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kw-ctrl span{font-size:12px;font-weight:600;min-width:48px;text-align:center}
.nav-btns{display:flex;gap:4px}
.nbtn{padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
.nbtn.primary{background:var(--accent);color:white;border-color:transparent}
.nbtn.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.tab.aktiv{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:10px;max-width:1200px;margin:0 auto}
.saved-badge{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--accent-bg);color:var(--accent);display:none}
.saved-badge.show{display:inline-block}

/* Conflict banner */
.conflict-banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.conflict-banner .conflict-list{flex:1;font-size:12px;color:var(--warn)}
.conflict-banner .conflict-list li{margin-bottom:3px}
.conflict-banner .ignore-btn{font-size:11px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--warn);background:var(--bg);color:var(--warn);cursor:pointer;white-space:nowrap;flex-shrink:0}

/* Stats */
.stats{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stats::-webkit-scrollbar{display:none}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;flex-shrink:0;min-width:80px}
.stat-label{font-size:10px;color:var(--text2);margin-bottom:2px}
.stat-val{font-size:18px;font-weight:600}

/* Week table */
.week-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);border:1px solid var(--border)}
.week-table{min-width:660px;border-collapse:collapse;width:100%}
.week-table th{background:var(--bg3);font-size:11px;font-weight:600;text-align:center;padding:6px 4px;border:1px solid var(--border);color:var(--text2);cursor:pointer}
.week-table th:first-child{text-align:left;padding-left:8px;min-width:105px;cursor:default}
.week-table th:hover:not(:first-child){background:var(--accent-bg);color:var(--accent)}
.week-table td{border:1px solid var(--border);padding:2px 3px;vertical-align:top;height:52px;position:relative}
.week-table td:first-child{padding:4px 8px;background:var(--bg2)}
.ma-name-c{font-size:11px;font-weight:600}
.ma-soll-c{font-size:10px;color:var(--text3)}
.mini-tl{position:relative;height:22px;background:var(--bg3);border-radius:4px;overflow:hidden;cursor:pointer}
.mini-bar{position:absolute;height:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mini-bar span{font-size:9px;font-weight:600;color:#333;white-space:nowrap;padding:0 3px}
.mini-fz{display:flex;align-items:center;justify-content:center;height:22px;font-size:10px;color:var(--text3)}
.mini-url{display:flex;align-items:center;justify-content:center;height:22px;font-size:10px;font-weight:600;color:#712B13;background:#FAECE7;border-radius:4px}
.mini-bs{display:flex;align-items:center;justify-content:center;height:22px;font-size:10px;font-weight:600;color:#633806;background:#FAEEDA;border-radius:4px}
.mini-ausn{border:2px dashed var(--warn);border-radius:4px}
.diff-pos{color:var(--danger)}.diff-neg{color:var(--info)}.diff-ok{color:var(--accent)}

/* Day editor */
.day-tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{padding:7px 12px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.day-tab.aktiv{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.day-editor{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.ma-edit-row{padding:10px 12px;border-bottom:1px solid var(--border)}
.ma-edit-row:last-child{border-bottom:none}
.ma-edit-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ma-edit-name{font-size:13px;font-weight:600;flex:1}
.ma-std{font-size:12px;font-weight:500;color:var(--text2)}
.ausn-badge{font-size:9px;padding:2px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.status-pills{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.pill{font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);cursor:pointer;font-weight:500;color:var(--text2);background:var(--bg)}
.pill.on-work{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.pill.on-fz{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.pill.on-url{background:#FAECE7;color:#712B13;border-color:#F5C4B3}
.pill.on-bs{background:var(--warn-bg);color:var(--warn);border-color:#FAC775}
.pill.on-ft{background:#F5C4B3;color:#712B13;border-color:#F0997B}
.pill.on-krank{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.pill.on-bzb{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.pill.on-ap{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.pill.on-metz{background:#FFD5B0;color:#7A3500;border-color:#E8833A}
.pill.on-baeck{background:#F9E4B7;color:#6B4A00;border-color:#D4A843}
.pill.on-neutral{background:#E8E8E8;color:#555;border-color:#AAA}

/* Timeline */
.timeline{position:relative;height:34px;background:var(--bg3);border-radius:var(--radius-sm);margin:4px 0;overflow:visible}
.tl-bar{position:absolute;height:100%;border-radius:var(--radius-sm);cursor:grab;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
.tl-bar:active{cursor:grabbing;opacity:.85}
.tl-handle{position:absolute;top:0;width:10px;height:100%;cursor:ew-resize;z-index:3;background:rgba(0,0,0,.12)}
.tl-handle-l{left:0;border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.tl-handle-r{right:0;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.tl-label{font-size:10px;font-weight:700;color:#333;pointer-events:none;white-space:nowrap}
.tl-tick{position:absolute;top:0;width:.5px;height:100%;background:var(--border);pointer-events:none}
.tl-tick-l{position:absolute;bottom:-14px;font-size:8px;color:var(--text3);transform:translateX(-50%);pointer-events:none}
.time-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px}
.time-row input[type=time]{font-size:11px;padding:3px 5px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text)}
.time-row select{font-size:11px;padding:3px 5px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text)}
.time-row input[type=text]{font-size:11px;padding:3px 7px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);flex:1;min-width:100px}
.no-work-cell{height:34px;background:var(--bg3);border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--text3);margin:4px 0}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:500px){.modal-bg{align-items:center;padding:16px}}
.modal{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
@media(min-width:500px){.modal{border-radius:var(--radius)}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px}
.field{margin-bottom:10px}
.field label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.field textarea{min-height:60px;resize:vertical}
.komp-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.komp-chip{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);cursor:pointer;color:var(--text2);background:var(--bg)}
.komp-chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:white;border-color:transparent}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}

/* MA list */
.ma-list{display:flex;flex-direction:column;gap:6px}
.ma-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px}
.ma-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ma-info{flex:1}
.ma-info-name{font-size:13px;font-weight:600}
.ma-info-detail{font-size:10px;color:var(--text2);margin-top:1px}
.komp-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.komp-tag{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--bg3);color:var(--text2)}
.ma-actions{display:flex;gap:5px}
.icon-btn{width:30px;height:22px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Stammdaten */
.stamm-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.stamm-header{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.stamm-grid{display:grid;grid-template-columns:80px 1fr;gap:4px 8px;font-size:12px;align-items:center}
.stamm-label{color:var(--text2)}

/* Stunden */
.std-table{width:100%;border-collapse:collapse}
.std-table th{font-size:11px;font-weight:600;text-align:left;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.std-table td{font-size:12px;padding:7px 8px;border:1px solid var(--border)}
.std-bar-wrap{height:6px;background:var(--bg3);border-radius:999px;overflow:hidden;margin-top:2px}
.std-bar-fill{height:100%;border-radius:999px}

/* Ausnahmen */
.ausn-list{display:flex;flex-direction:column;gap:6px}
.ausn-item{background:var(--bg2);border:1px solid var(--warn);border-radius:var(--radius-sm);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px}
.ausn-item .ausn-del{margin-left:auto;cursor:pointer;color:var(--danger);font-size:16px}

.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
@media print{.no-print{display:none!important}.mini-bar{outline:none!important;border:none!important}}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:3px}
.farbe-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.section-title{font-size:13px;font-weight:600;margin-bottom:8px;margin-top:14px;color:var(--text)}
</style>
</head>
<body>

<div class="nav">
  <span class="nav-title" id="nav-title">Schichtplan</span>
  <span class="saved-badge" id="saved-badge">✓ Gespeichert</span>
  <div class="kw-ctrl">
    <button onclick="changeKW(-1)">‹</button>
    <span id="kw-label">KW 21</span>
    <button onclick="changeKW(1)">›</button>
  </div>
  <div class="nav-btns">
    <button class="nbtn warn" onclick="exportForClaude()">📋 PDF via Claude</button>
    <button class="nbtn" onclick="printDirect()" title="Direkt drucken">🖨️ Drucken</button>
    <button class="nbtn" onclick="exportData()" title="Daten exportieren">💾 Export</button>
    <button class="nbtn" onclick="document.getElementById('importFile').click()" title="Daten importieren">📂 Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="nbtn primary" onclick="showAddMA()">+ MA</button>
  </div>
</div>

<div class="tabs">
  <div class="tab aktiv" id="tab-woche" onclick="showView('woche')">Woche</div>
  <div class="tab" id="tab-tag" onclick="showView('tag')">Tag</div>
  <div class="tab" id="tab-ausn" onclick="showView('ausn')">Ausnahmen</div>
  <div class="tab" id="tab-ma" onclick="showView('ma')">Mitarbeiter</div>
  <div class="tab" id="tab-std" onclick="showView('std')">Stunden</div>
</div>

<div class="main">
  <div id="conflict-area"></div>
  <div class="stats" id="stats-row"></div>
  <div id="view-woche"></div>
  <div id="view-tag" style="display:none"></div>
  <div id="view-ausn" style="display:none"></div>
  <div id="view-ma" style="display:none"></div>
  <div id="view-std" style="display:none"></div>
</div>

<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const T0=6,T1=22,TR=T1-T0
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag']
const FARBEN={og:{bg:'#C0DD97',label:'O&G'},blau:{bg:'#B5D4F4',label:'Bereiche'},spaet:{bg:'#CECBF6',label:'Spät'},gelb:{bg:'#FAC775',label:'Berufsschule'},ft:{bg:'#F5C4B3',label:'Urlaub/FT'},bzb:{bg:'#D8C4F0',label:'BZB'},ap:{bg:'#B8E8D4',label:'AP'},metz:{bg:'#FFD5B0',label:'Metzgerei'},baeck:{bg:'#F9E4B7',label:'Bäckerei'},neutral:{bg:'#E8E8E8',label:'–'}}

const WDAYS=['Mo','Di','Mi','Do','Fr','Sa']
let curKW=21,curDay=0,curView='woche',dragState=null
let dayNotes={} // {kw_di: 'Notiz'}
let ignoredConflicts=new Set()

const defaultMA=[

  {id:3,name:'Stelzmüller',soll:35,komps:['Kasse','Büro'],farbe:'#FAC775',schwanger:true,stamm:{mo:{t:'fz'},di:{t:'fz'},mi:{t:'fz'},do:{t:'fz'},fr:{t:'fz'},sa:{t:'fz'}}},
  {id:4,name:'Maurus',soll:39,komps:['O&G','Laden'],farbe:'#C0DD97',stamm:{mo:{t:'fz'},di:{t:'fz'},mi:{t:'fz'},do:{t:'fz'},fr:{t:'fz'},sa:{t:'fz'}}},

  {id:10,name:'Seigried',soll:15,komps:['Mopro'],farbe:'#D3D1C7',stamm:{mo:{t:'fz'},di:{t:'fz'},mi:{t:'fz'},do:{t:'fz'},fr:{t:'fz'},sa:{t:'fz'}}},

]

// State
let maList=JSON.parse(JSON.stringify(defaultMA))
let shifts={}  // {kw: {maId: [tage]}}
let ausnahmen={} // {kw: [{maId, dayIdx, grund, notiz}]}
let loaded=false

function loadState(){
  try{
    const ms=localStorage.getItem('sp_ma'); if(ms)maList=JSON.parse(ms)
    const ss=localStorage.getItem('sp_shifts'); if(ss)shifts=JSON.parse(ss)
    const as=localStorage.getItem('sp_ausn'); if(as)ausnahmen=JSON.parse(as)
    const ns=localStorage.getItem('sp_notes'); if(ns)dayNotes=JSON.parse(ns)
    loaded=true
  }catch(e){loaded=true}
  // Init KW21 if not saved
  if(!shifts[21]){
    shifts[21]={}
    maList.forEach(ma=>{
      const key=`k${ma.id}`
      const ov=kw21Overrides.find(o=>o.maId===ma.id)
      if(ov){shifts[21][key]=ov.tage}
      else{shifts[21][key]=Array(6).fill(null)}
    })
  }
}

function saveState(){
  try{
    localStorage.setItem('sp_ma',JSON.stringify(maList))
    localStorage.setItem('sp_shifts',JSON.stringify(shifts))
    localStorage.setItem('sp_ausn',JSON.stringify(ausnahmen))
    localStorage.setItem('sp_notes',JSON.stringify(dayNotes))
    const b=document.getElementById('saved-badge')
    b.classList.add('show')
    setTimeout(()=>b.classList.remove('show'),2000)
  }catch(e){}
}

function getDayKey(di){return['mo','di','mi','do','fr','sa'][di]}

function getShift(kw,maId,di){
  const key=`k${maId}`
  if(!shifts[kw])return null
  const arr=shifts[kw][key]
  if(!arr)return null
  return arr[di]
}

function setShift(kw,maId,di,val){
  const key=`k${maId}`
  if(!shifts[kw])shifts[kw]={}
  if(!shifts[kw][key])shifts[kw][key]=Array(6).fill(null)
  shifts[kw][key][di]=val
  saveState()
}

function getEffectiveShift(kw,maId,di){
  // Check ausnahme first
  const ausn=getAusnahme(kw,maId,di)
  if(ausn){
    if((ausn.typ==='work'||ausn.typ==='bzb'||ausn.typ==='ap')&&ausn.s&&ausn.e)
      return {t:ausn.typ,s:ausn.s,e:ausn.e,f:ausn.typ==='ap'?'og':'blau',bem:ausn.bem||ausn.notiz||'',_ausnahme:true}
    return {t:ausn.typ||'fz', _ausnahme:true, bem:ausn.notiz||''}
  }
  const ov=getShift(kw,maId,di)
  if(ov!==null&&ov!==undefined)return ov
  // Fall back to Stammdaten
  const ma=maList.find(m=>m.id===maId)
  if(!ma||!ma.stamm)return{t:'fz'}
  // Urlaubs-KW → immer Urlaub, außer Samstag (di=5) → FZ
  const hatUrlaubKW=(ma.urlaube||[]).some(u=>kw>=u.von&&kw<=(u.bis||u.von))
  if(hatUrlaubKW) return di===5?{t:'fz'}:{t:'url'}
  const dk=getDayKey(di)
  const st=ma.stamm[dk]
  if(!st)return{t:'fz'}
  if(st.s&&st.e)return{t:'work',s:st.s,e:st.e,f:st.f||'blau',bem:st.bem||''}
  return{t:st.t||'fz'}
}

function getAusnahme(kw,maId,di){
  if(!ausnahmen[kw])return null
  return ausnahmen[kw].find(a=>a.maId===maId&&a.dayIdx===di)||null
}

// Hours
function calcH(s,e){const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);const b=(eh*60+em-sh*60-sm)/60;return b>6?b-0.5:b}
function fmtH(h){if(h<=0)return'–';const m=Math.round((h%1)*60);return m?`${Math.floor(h)},${String(m).padStart(2,'0')}`:`${Math.floor(h)}`}
function tFrac(t){const[h,m]=t.split(':').map(Number);return(h+m/60-T0)/TR}
function toT(v){const h=Math.floor(v),m=Math.round((v-h)*60);return`${h}:${String(m).padStart(2,'0')}`}
function snapT(v){return Math.round(v*4)/4}

function getWeekArb(kw,maId){
  const ma=maList.find(m=>m.id===maId)
  let total=0
  for(let di=0;di<6;di++){
    const t=getEffectiveShift(kw,maId,di)
    if(t.t==='work'){
      if(ma&&ma.isMack){
        // BZB als 2. Balken → nur 4h tatsächliche Arbeitszeit
        const hasBZB=t.f2==='bzb'&&t.s2&&t.e2
        total+=hasBZB?4:8
      } else {
        if(t.s&&t.e) total+=calcH(t.s,t.e)
        if(t.s2&&t.e2) total+=calcH(t.s2,t.e2)
      }
    }
    // BZB als eigener Status (ohne Arbeit daneben)
    if(t.t==='bzb'){
      if(ma&&ma.isMack) total+=4
    }
  }
  return Math.round(total*100)/100
}
function getWeekUrl(kw,maId,ma){
  let days=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='url')days++}
  return Math.round(days*(ma.soll/5)*100)/100
}
function getWeekFT(kw,maId,ma){
  let days=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='ft')days++}
  return Math.round(days*(ma.soll/6)*100)/100
}
function getWeekBZBAP(kw,maId,ma){
  let total=0
  for(let di=0;di<6;di++){
    const t=getEffectiveShift(kw,maId,di)
    if((t.t==='bzb'||t.t==='ap')&&t.s&&t.e) total+=calcH(t.s,t.e)
    // Mack: BZB als 2. Balken → immer fest 4h
    if(t.t==='work'&&t.f2==='bzb'&&t.s2&&t.e2) total+=(ma&&ma.isMack)?4:calcH(t.s2,t.e2)
    if(t.t==='work'&&t.f2==='ap'&&t.s2&&t.e2) total+=(ma&&ma.isMack)?4:calcH(t.s2,t.e2)
  }
  return Math.round(total*100)/100
}
function getWeekBS(kw,maId,ma){
  let days=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='bs')days++}
  return Math.round(days*(ma.soll/5)*100)/100
}

// Conflict detection
function detectConflicts(){
  const conflicts=[]
  // Ruhezeit: wenn Spätschicht bis 20:15+, dann nächster Tag frühestens 7:15 (wir machen 7:30)
  maList.forEach(ma=>{
    for(let di=0;di<5;di++){
      const t=getEffectiveShift(curKW,ma.id,di)
      if(t.t==='work'&&t.e){
        const[eh,em]=t.e.split(':').map(Number)
        const endMin=eh*60+em
        const next=getEffectiveShift(curKW,ma.id,di+1)
        if(next.t==='work'&&next.s){
          const[sh,sm]=next.s.split(':').map(Number)
          const startMin=sh*60+sm
          const rest=(24*60-endMin)+startMin
          if(rest<11*60){
            const cid=`ruhe_${ma.id}_${di}`
            if(!ignoredConflicts.has(cid))
              conflicts.push({id:cid,text:`${ma.name}: Ruhezeit ${DAYS[di]} ${t.e}→${DAYS[di+1]} ${next.s} (${Math.round(rest/60*10)/10}h < 11h)`})
          }
        }
      }
    }
  })
  // Schwanger - max 20:00 und max 8,5h
  maList.forEach(ma=>{
    if(!ma.schwanger)return
    for(let di=0;di<6;di++){
      const t=getEffectiveShift(curKW,ma.id,di)
      if(t.t==='work'&&t.s&&t.e){
        const[eh,em]=t.e.split(':').map(Number)
        const endMin=eh*60+em
        // Ende nach 20:00
        if(endMin>20*60){
          const cid=`schw_end_${ma.id}_${di}`
          if(!ignoredConflicts.has(cid))
            conflicts.push({id:cid,text:`${ma.name} 🤰: Ende ${t.e} nach 20:00 am ${DAYS[di]}`})
        }
        // Mehr als 8,5h
        const h=calcH(t.s,t.e)
        if(h>8.5){
          const cid=`schw_std_${ma.id}_${di}`
          if(!ignoredConflicts.has(cid))
            conflicts.push({id:cid,text:`${ma.name} 🤰: ${fmtH(h)}h am ${DAYS[di]} – max. 8,5h erlaubt`})
        }
      }
    }
  })
  // Abweichung von Stammdaten prüfen
  maList.forEach(ma=>{
    if(!ma.stamm) return
    const dkeys=['mo','di','mi','do','fr','sa']
    for(let di=0;di<6;di++){
      const dk=dkeys[di]
      const stamm=ma.stamm[dk]
      if(!stamm) continue // no stamm for this day
      if(!stamm.s&&!stamm.e&&stamm.t==='fz'||stamm.t==='bs'){} // FZ/BS - still check plan
      const ov=getShift(curKW,ma.id,di)
      if(!ov) continue // using stamm = no conflict
      // Check if override differs from stamm
      const stammIsWork=!!(stamm&&stamm.s&&stamm.e)
      const ovIsWork=!!(ov.t==='work'&&ov.s&&ov.e)
      // Stamm says work but override differs
      if(stammIsWork&&ovIsWork&&(ov.s!==stamm.s||ov.e!==stamm.e)){
        const cid=`stamm_${ma.id}_${di}_${curKW}`
        if(!ignoredConflicts.has(cid))
          conflicts.push({id:cid,text:`${ma.name} ${DAYS[di]}: Abweichung von Spezialzeit (${stamm.s}–${stamm.e} → ${ov.s}–${ov.e})`})
      }
      // Stamm says FZ/BS but plan says work
      if(stamm&&!stammIsWork&&(stamm.t==='fz'||stamm.t==='bs')&&ovIsWork){
        const cid=`stamm_fz_${ma.id}_${di}_${curKW}`
        if(!ignoredConflicts.has(cid))
          conflicts.push({id:cid,text:`${ma.name} ${DAYS[di]}: Spezialzeit ist ${stamm.t==='fz'?'FZ':'Berufsschule'} – trotzdem als Arbeit eingeplant`})
      }
    }
  })

  // Geplanter Urlaub diese KW nicht eingetragen
  maList.forEach(ma=>{
    if(!ma.urlaube||!ma.urlaube.length)return
    ma.urlaube.forEach(u=>{
      if(curKW>=u.von&&curKW<=(u.bis||u.von)){
        const hasWork=Array.from({length:6},(_,di)=>getEffectiveShift(curKW,ma.id,di)).some(t=>t.t==='work')
        if(hasWork){
          const cid=`urlplan_${ma.id}_${curKW}`
          if(!ignoredConflicts.has(cid))
            conflicts.push({id:cid,text:`${ma.name}: Geplanter Urlaub KW ${u.von}${u.bis&&u.bis!==u.von?`–${u.bis}`:''}${u.notiz?` (${u.notiz})`:''} – aber noch Schichten eingetragen!`})
        }
      }
    })
  })
  return conflicts
}

function renderConflicts(){
  const cf=detectConflicts()
  const el=document.getElementById('conflict-area')
  if(!cf.length){el.innerHTML='';return}
  el.innerHTML=`<div class="conflict-banner">
    <div class="conflict-list"><b>⚠️ Hinweise:</b><ul style="margin-top:4px;padding-left:16px">${cf.map(c=>`<li>${c.text}</li>`).join('')}</ul></div>
    <button class="ignore-btn" onclick="ignoreAll([${cf.map(c=>`'${c.id}'`).join(',')}])">Ignorieren</button>
  </div>`
}
function ignoreAll(ids){ids.forEach(id=>ignoredConflicts.add(id));renderConflicts()}

// Bayerische Feiertage 2026 (Format: 'DD.MM.')
const FEIERTAGE_2026={
  '01.01.':'Neujahr',
  '06.01.':'Heilige Drei Könige',
  '03.04.':'Karfreitag',
  '05.04.':'Ostersonntag',
  '06.04.':'Ostermontag',
  '01.05.':'Tag der Arbeit',
  '14.05.':'Christi Himmelfahrt',
  '24.05.':'Pfingstsonntag',
  '25.05.':'Pfingstmontag',
  '04.06.':'Fronleichnam',
  '15.08.':'Mariä Himmelfahrt',
  '03.10.':'Tag der Deutschen Einheit',
  '01.11.':'Allerheiligen',
  '25.12.':'1. Weihnachtstag',
  '26.12.':'2. Weihnachtstag',
}

function getDateObj(kw,di){
  // KW1 Monday: find monday of week containing Jan 4
  const jan4=new Date(2026,0,4)
  const dow=(jan4.getDay()+6)%7 // Mon=0..Sun=6
  const kw1Monday=new Date(jan4)
  kw1Monday.setDate(jan4.getDate()-dow)
  const d=new Date(kw1Monday)
  d.setDate(kw1Monday.getDate()+(kw-1)*7+di)
  return d
}

function getDateStr(kw,di){
  const d=getDateObj(kw,di)
  return`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.`
}

function isFeiertag(kw,di){
  const dateStr=getDateStr(kw,di)
  return FEIERTAGE_2026[dateStr]||null
}

    const arb=getWeekArb(curKW,ma.id)
    const url=getWeekUrl(curKW,ma.id,ma)
    const ft=getWeekFT(curKW,ma.id,ma)
    const bs=getWeekBS(curKW,ma.id,ma)
    const bzbap=getWeekBZBAP(curKW,ma.id,ma)

    const diff=Math.round((total-ma.soll)*100)/100
    const dispArb=arb
    const dispDiff=diff

    html+=`<tr><td>
      <div class="ma-name-c">${ma.name}${ma.schwanger?' 🤰':''}</div>
      <div class="ma-soll-c">${fmtH(dispArb)}/${ma.soll}h <span class="${dispDiff>1?'diff-pos':dispDiff<-1?'diff-neg':'diff-ok'}">${dispDiff>=0?'+':''}${dispDiff}</span></div>
    </td>`

    for(let di=0;di<6;di++){
      const t=getEffectiveShift(curKW,ma.id,di)
      const hasAusn=!!getAusnahme(curKW,ma.id,di)
      const ausnCls=hasAusn?'mini-ausn':''
      const ftDay=isFeiertag(curKW,di)
      const ftStyle=ftDay?'background:#FFF3E0;':''

      const st=ma.stamm&&ma.stamm[dk]
      const isStamm=!hasAusn&&st&&st.s&&st.e&&t.s===st.s&&t.e===st.e
      const wunschStyle=isStamm?'outline:2px solid #E65100;outline-offset:-2px;':''

      } else if(t.t==='url'){html+=`<td onclick="curDay=${di};showView('tag')" style="${ftStyle}"><div class="mini-url ${ausnCls}">Urlaub</div></td>`}
      else if(t.t==='ft'){html+=`<td onclick="curDay=${di};showView('tag')" style="background:#FDDCB5"><div class="mini-url" style="background:#F5C4B3;color:#712B13">FT</div></td>`}

function removeSecondShift(maId,di){
  const ma=maList.find(m=>m.id==maId);if(!ma)return

  const upd={...cur}
  delete upd.s2;delete upd.e2;delete upd.f2;delete upd.bem2
  setShift(curKW,ma.id,di,upd)
  renderTag()
}

function setStatus(maId,di,status){
  const ma=maList.find(m=>m.id==maId)
  if(!ma)return
  const cur=getEffectiveShift(curKW,ma.id,di)
  let val
  if(status==='work'||status==='bzb'||status==='ap'||status==='metz'||status==='baeck'){
    const f=status==='bzb'?'bzb':status==='ap'?'ap':status==='metz'?'metz':status==='baeck'?'baeck':'blau'
    val={t:status,s:cur.s||'8:00',e:cur.e||'16:00',f,bem:cur.bem||''}
  } else if(status==='neutral'){
    val={t:'neutral',f:'neutral',bem:''}
  }
  else val={t:status}
  setShift(curKW,ma.id,di,val)
  renderTag();renderStats();renderConflicts()
}

function updateTime(maId,di,field,val){

  const cur=getEffectiveShift(curKW,ma.id,di)

}

// Drag
function getCXY(e){return e.touches?{x:e.touches[0].clientX}:{x:e.clientX}}
function startDrag(e,maId,mode){
  e.preventDefault()
  const tl=document.getElementById('tl_'+maId);if(!tl)return
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const t=getEffectiveShift(curKW,ma.id,curDay)
  const is2=mode.includes('2')
  dragState={maId,mode,rect:tl.getBoundingClientRect(),startX:getCXY(e).x,startS:is2?(t.s2||t.s):t.s,startE:is2?(t.e2||t.e):t.e}
  document.addEventListener('mousemove',onDrag);document.addEventListener('mouseup',stopDrag)
}
function startDragTouch(e,maId,mode){
  const tl=document.getElementById('tl_'+maId);if(!tl)return
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const t=getEffectiveShift(curKW,ma.id,curDay)
  const is2=mode.includes('2')
  dragState={maId,mode,rect:tl.getBoundingClientRect(),startX:getCXY(e).x,startS:is2?(t.s2||t.s):t.s,startE:is2?(t.e2||t.e):t.e}
  document.addEventListener('touchmove',onDrag,{passive:false});document.addEventListener('touchend',stopDrag)
}
function onDrag(e){
  if(!dragState)return;if(e.cancelable)e.preventDefault()
  const{maId,mode,rect,startX,startS,startE}=dragState
  const dx=(getCXY(e).x-startX)/rect.width
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const t=getEffectiveShift(curKW,ma.id,curDay)
  const is2=mode.includes('2')
  const modeBase=mode.replace('2','')
  const[sh,sm]=startS.split(':').map(Number),[eh,em]=startE.split(':').map(Number)
  const dur=(eh*60+em-sh*60-sm)/60
  let ns,ne
  if(modeBase==='move'){
    ns=snapT((sh+sm/60-T0)+dx*TR);ns=Math.max(0,Math.min(TR-dur,ns));ne=ns+dur
    if(is2){t.s2=toT(T0+ns);t.e2=toT(T0+ne)}else{t.s=toT(T0+ns);t.e=toT(T0+ne)}
  } else if(modeBase==='left'){
    ns=snapT((sh+sm/60-T0)+dx*TR);ns=Math.max(0,Math.min((eh+em/60-T0)-.25,ns))
    if(is2)t.s2=toT(T0+ns);else t.s=toT(T0+ns)
  } else {
    ne=snapT((eh+em/60-T0)+dx*TR);ne=Math.max((sh+sm/60-T0)+.25,Math.min(TR,ne))
    if(is2)t.e2=toT(T0+ne);else t.e=toT(T0+ne)
  }
  // Update bar 1
  if(!is2){
    const bar=document.getElementById('bar_'+maId)
    if(bar){bar.style.left=tFrac(t.s)*100+'%';bar.style.width=(tFrac(t.e)-tFrac(t.s))*100+'%';const lbl=document.getElementById('lbl_'+maId);if(lbl)lbl.textContent=t.s+'–'+t.e}
  }
  // Update bar 2
  if(is2){
    const bar2=document.getElementById('bar2_'+maId)
    if(bar2&&t.s2&&t.e2){
      bar2.style.left=tFrac(t.s2)*100+'%'
      bar2.style.width=(tFrac(t.e2)-tFrac(t.s2))*100+'%'
      const lbl2=bar2.querySelector('.tl-label')
      if(lbl2)lbl2.textContent=t.s2+'–'+t.e2
    }
  }
  const std=document.getElementById('std_'+maId)
  const h1=calcH(t.s,t.e), h2=t.s2&&t.e2?calcH(t.s2,t.e2):0
  if(std)std.textContent=fmtH(h1+h2)+' Std.'
}
function stopDrag(){
  if(!dragState)return
  const{maId,mode}=dragState
  const ma=maList.find(m=>m.id==maId)
  if(ma){const t=getEffectiveShift(curKW,ma.id,curDay);setShift(curKW,ma.id,curDay,{...t})}
  dragState=null
  document.removeEventListener('mousemove',onDrag);document.removeEventListener('mouseup',stopDrag)
  document.removeEventListener('touchmove',onDrag);document.removeEventListener('touchend',stopDrag)
  renderConflicts()
}

  const keys=['mo','di','mi','do','fr','sa']

  let html=`<h3>Stammdaten: ${ma.name}</h3>`
  keys.forEach((k,i)=>{
    const st=ma.stamm[k]||{t:'fz'}

    html+=`<div class="stamm-grid" style="margin-bottom:8px">

}
function updateStammBem(maId,dk,val){

}

function saveMA(id){
  const name=document.getElementById('f-name').value.trim()
  const soll=parseInt(document.getElementById('f-soll').value)||0
  const resturlaub=parseFloat(document.getElementById('f-resturlaub').value)||0
  const komps=[...document.querySelectorAll('#komp-grid .komp-chip.on')].map(e=>e.dataset.k)
  const schwanger=document.getElementById('f-schw').checked
  const hinweise=document.getElementById('f-hinweise').value.trim()
  const urlaube=[...tempUrlaube]
  const stamm={...tempStamm}
  const numId=parseInt(id)

  if(!name)return alert('Bitte Namen eingeben')
  if(numId&&!isNaN(numId)){
    const ma=maList.find(m=>m.id===numId)
    if(!ma)return alert('Mitarbeiter nicht gefunden!')
    Object.assign(ma,{name,soll,resturlaub,komps,schwanger,hinweise,urlaube,stamm})
  } else {
    const newId=Math.max(0,...maList.map(m=>m.id))+1
    const newMa={id:newId,name,soll,resturlaub,komps,schwanger,hinweise,urlaube,stamm,farbe:AVCOLS[maList.length%AVCOLS.length],stamm:{mo:{t:'fz'},di:{t:'fz'},mi:{t:'fz'},do:{t:'fz'},fr:{t:'fz'},sa:{t:'fz'}}}
    maList.push(newMa)
    Object.keys(shifts).forEach(kw=>{if(!shifts[kw][`k${newId}`])shifts[kw][`k${newId}`]=Array(6).fill(null)})
  }
  saveState();closeModal();renderAll()
}
function deleteMA(id){
  if(!confirm('Mitarbeiter wirklich löschen?'))return
  maList=maList.filter(m=>m.id!==id)
  Object.keys(shifts).forEach(kw=>{delete shifts[kw][`k${id}`]})
  saveState();closeModal();renderAll()
}

function getResturlaub(ma){
  if(ma.resturlaub==null) return '–'
  let used=0
  Object.keys(shifts).forEach(kw=>{
    for(let di=0;di<6;di++){
      const t=getEffectiveShift(parseInt(kw),ma.id,di)
      if(t.t==='url') used++
    }
  })
  return Math.max(0, ma.resturlaub - used)
}

// === STUNDEN ===
function renderStd(){
  const el=document.getElementById('view-std')
  const rows=maList.map(ma=>{
    const arb=getWeekArb(curKW,ma.id)
    const url=getWeekUrl(curKW,ma.id,ma)
    const ft=getWeekFT(curKW,ma.id,ma)
    const bs=getWeekBS(curKW,ma.id,ma)
    const bzbap=getWeekBZBAP(curKW,ma.id,ma)
    const total=arb+url+ft+bs+bzbap
    const diff=Math.round((total-ma.soll)*100)/100
    return{ma,arb,url,ft,bs,bzbap,total,diff}
  }).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff))

  let html=`<table class="std-table"><thead><tr><th>Name</th><th>Arb. Std.</th><th>Urlaub</th><th>FT</th><th>BS</th><th>BZB/AP</th><th>Sonstige</th><th>Gesamt</th><th>Soll</th><th>Diff</th><th>🏖 Rest</th><th style="min-width:70px">Auslastung</th></tr></thead><tbody>`
  rows.forEach(({ma,arb,url,ft,bs,bzbap,total,diff})=>{
    const sonstige=Math.round((url+ft+bs+bzbap)*100)/100
    const pct=Math.min(100,Math.round(total/ma.soll*100))||0
    const barCol=diff>2?'#E24B4A':diff<-2?'#378ADD':'#97C459'
    const diffCls=diff>1?'diff-pos':diff<-1?'diff-neg':'diff-ok'
    const rest=getResturlaub(ma)
    const restStyle=typeof rest==='number'&&rest<=5?'color:var(--danger);font-weight:700':typeof rest==='number'&&rest<=10?'color:var(--warn);font-weight:600':''
    html+=`<tr>
      <td style="font-weight:600">${ma.name}${ma.schwanger?' 🤰':''}</td>
      <td style="font-weight:600;color:var(--accent)">${fmtH(arb)}</td>
      <td>${url>0?fmtH(url):'–'}</td><td>${ft>0?fmtH(ft):'–'}</td>
      <td>${bs>0?fmtH(bs):'–'}</td>
      <td>${bzbap>0?fmtH(bzbap):'–'}</td>
      <td style="font-weight:600;color:var(--info)">${sonstige>0?fmtH(sonstige):'–'}</td>
      <td style="font-weight:700">${fmtH(total)}</td>
      <td>${ma.soll}</td>
      <td class="${diffCls}" style="font-weight:600">${diff>=0?'+':''}${diff}</td>
      <td style="${restStyle}">${rest}</td>
      <td><div class="std-bar-wrap"><div class="std-bar-fill" style="width:${pct}%;background:${barCol}"></div></div><span style="font-size:10px;color:var(--text3)">${pct}%</span></td>
    </tr>`
  })
  const sumArb=Math.round(rows.reduce((s,r)=>s+r.arb,0)*100)/100
  const sumUrl=Math.round(rows.reduce((s,r)=>s+r.url,0)*100)/100
  const sumFt=Math.round(rows.reduce((s,r)=>s+r.ft,0)*100)/100
  const sumBs=Math.round(rows.reduce((s,r)=>s+r.bs,0)*100)/100
  const sumBzbap=Math.round(rows.reduce((s,r)=>s+r.bzbap,0)*100)/100
  const sumSonstige=Math.round((sumUrl+sumFt+sumBs+sumBzbap)*100)/100
  const sumGesamt=Math.round((sumArb+sumSonstige)*100)/100
  const sumSoll=rows.reduce((s,r)=>s+r.ma.soll,0)
  const sumDiff=Math.round((sumGesamt-sumSoll)*100)/100
  const sumDiffCls=sumDiff>1?'diff-pos':sumDiff<-1?'diff-neg':'diff-ok'
  html+=`<tr style="border-top:2px solid var(--border2);background:var(--bg3);font-weight:700">
    <td>Gesamt</td>
    <td style="color:var(--accent)">${fmtH(sumArb)}</td>
    <td>${sumUrl>0?fmtH(sumUrl):'–'}</td>
    <td>${sumFt>0?fmtH(sumFt):'–'}</td>
    <td>${sumBs>0?fmtH(sumBs):'–'}</td>
    <td>${sumBzbap>0?fmtH(sumBzbap):'–'}</td>
    <td style="color:var(--info)">${sumSonstige>0?fmtH(sumSonstige):'–'}</td>
    <td>${fmtH(sumGesamt)}</td>
    <td>${sumSoll}</td>
    <td class="${sumDiffCls}">${sumDiff>=0?'+':''}${sumDiff}</td>
    <td></td>
    <td></td>
  </tr>`
  html+=`</tbody></table>`
  el.innerHTML=html
}

function importData(event){
  const file = event.target.files[0]
  if(!file) return
  const reader = new FileReader()
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result)
      if(!data.version || !data.maList){
        alert('Ungültige Backup-Datei!')
        return
      }
      if(!confirm(`Backup vom ${data.exportDate} importieren? Aktuelle Daten werden überschrieben!`)) return
      maList = data.maList
      shifts = data.shifts || {}
      ausnahmen = data.ausnahmen || {}
      saveState()
      renderAll()
      
      const hint = document.createElement('div')
      hint.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2D5016;color:white;padding:12px 20px;border-radius:10px;font-size:13px;z-index:9999;text-align:center'
      hint.innerHTML = '✓ Backup vom '+data.exportDate+' importiert!'
      document.body.appendChild(hint)
      setTimeout(()=>hint.remove(), 3000)
    } catch(err){
      alert('Fehler beim Importieren: ' + err.message)
    }
  }
  reader.readAsText(file)
  event.target.value = ''
}

// === WÜRFEL ===
function wuerfelWoche(){
  if(!confirm('Woche zufällig befüllen? Bestehende Einträge dieser KW werden überschrieben!')) return

  const frueH=[
    {s:'6:00',e:'15:00',f:'og',bem:'O&G + Laden'},
    {s:'6:30',e:'15:00',f:'og',bem:'O&G'},
    {s:'6:30',e:'13:00',f:'og',bem:'O&G + Kasse'},
    {s:'7:30',e:'15:00',f:'blau',bem:'Laden'},
    {s:'7:30',e:'16:00',f:'blau',bem:'Laden + Kasse'},
    {s:'8:00',e:'16:00',f:'blau',bem:'Laden'},
  ]
  const spaetH=[
    {s:'11:00',e:'20:15',f:'spaet',bem:'Laden + Kasse'},
    {s:'12:45',e:'20:00',f:'spaet',bem:'Kasse'},
    {s:'13:00',e:'20:15',f:'spaet',bem:'Laden'},
    {s:'13:00',e:'19:00',f:'spaet',bem:'Kasse'},
  ]

  function rnd(arr){return arr.length?arr[Math.floor(Math.random()*arr.length)]:null}
  function calcShiftH(tpl){return calcH(tpl.s,tpl.e)}
  function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m}
  // Ruhezeit prüfen: mindestens 11h zwischen Ende Vortag und Start heute
  function ruheOk(prevEnd, nextStart){
    if(!prevEnd||!nextStart) return true
    const rest=(24*60-toMin(prevEnd))+toMin(nextStart)
    return rest>=11*60
  }

  // Erst alle Schichten berechnen, dann eintragen
  const result={} // maId -> tage[]

  maList.forEach(ma=>{
    const tage=Array(6).fill(null)
    let geplant=0

    // Pass 1: Feiertage, Ausnahmen, Stammdaten fix setzen
    for(let di=0;di<6;di++){
      // Feiertag → immer FZ
      if(isFeiertag(curKW,di)){
        tage[di]={t:'fz'}
        continue
      }
      // Ausnahme hat Vorrang
      const ausn=getAusnahme(curKW,ma.id,di)
      if(ausn){
        tage[di]=null
        if((ausn.typ==='work'||ausn.typ==='bzb'||ausn.typ==='ap')&&ausn.s&&ausn.e)
          geplant+=calcH(ausn.s,ausn.e)
        else if(ausn.typ==='url'||ausn.typ==='bs') geplant+=ma.soll/5
        continue
      }
      // Stammdaten: explizite Arbeitszeit → fix eintragen (außer bei Urlaub)
      const dk=['mo','di','mi','do','fr','sa'][di]
      const st=ma.stamm&&ma.stamm[dk]
      // Urlaub-KW prüfen
      const hatUrlaubKW=(ma.urlaube||[]).some(u=>curKW>=u.von&&curKW<=(u.bis||u.von))
      if(st&&st.s&&st.e){
        if(hatUrlaubKW){
          tage[di]={t:'url'}
          geplant+=ma.soll/5
        } else {
          tage[di]={t:'work',s:st.s,e:st.e,f:st.f||'blau',bem:st.bem||''}
          geplant+=calcH(st.s,st.e)
        }
        continue
      }
      // Stamm = FZ/frei aber Urlaubs-KW → auch Urlaub eintragen
      if(hatUrlaubKW){
        tage[di]={t:'url'}
        geplant+=ma.soll/5
        continue
      }
      tage[di]='frei'
    }

    // Pass 2: Freie Tage zufällig mischen und befüllen
    const freieTage=tage.map((v,i)=>v==='frei'?i:-1).filter(i=>i>=0)
    for(let i=freieTage.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [freieTage[i],freieTage[j]]=[freieTage[j],freieTage[i]]
    }

    freieTage.forEach(di=>{
      if(geplant>=ma.soll-1){tage[di]={t:'fz'};return}

      const restSoll=ma.soll-geplant

      // Ruhezeit: Ende vom Vortag ermitteln
      const prevEnd=di>0&&tage[di-1]&&tage[di-1].t==='work'?tage[di-1].e:null
      // Ruhezeit: Start vom nächsten Tag ermitteln (soweit schon bekannt)
      const nextStart=di<5&&tage[di+1]&&tage[di+1].t==='work'?tage[di+1].s:null

      // Filtere Schichten die Ruhezeit verletzen würden
      const fruehOk=frueH.filter(t=>ruheOk(prevEnd,t.s)&&ruheOk(t.e,nextStart))
      const spaetOk=spaetH.filter(t=>ruheOk(prevEnd,t.s)&&ruheOk(t.e,nextStart))

      let tpl=null
      if(restSoll<=4){
        const kurz=[...fruehOk,...spaetOk].filter(t=>calcShiftH(t)<=restSoll+1)
        tpl=rnd(kurz.length?kurz:fruehOk.length?fruehOk:[...frueH])
      } else if(Math.random()<0.65){
        tpl=rnd(fruehOk.length?fruehOk:frueH)
      } else {
        tpl=rnd(spaetOk.length?spaetOk:spaetH)
      }
      if(!tpl) tpl=rnd(frueH) // Fallback

      tage[di]={t:'work',s:tpl.s,e:tpl.e,f:tpl.f,bem:tpl.bem}
      geplant+=calcShiftH(tpl)
    })

    // Rest auf FZ
    tage.forEach((v,i)=>{if(v==='frei')tage[i]={t:'fz'}})

    result[ma.id]=tage
  })

  // Alles in shifts eintragen
  if(!shifts[curKW])shifts[curKW]={}
  maList.forEach(ma=>{
    shifts[curKW][`k${ma.id}`]=result[ma.id]
  })

  saveState()
  renderAll()

  const hint=document.createElement('div')
  hint.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2D5016;color:white;padding:12px 20px;border-radius:10px;font-size:13px;z-index:9999'
  hint.textContent='🎲 Woche KW '+curKW+' wurde gewürfelt!'
  document.body.appendChild(hint)
  setTimeout(()=>hint.remove(),2500)
}

function printDirect(){
  const T0=6,T1=22,TR=T1-T0
  const FARBEN_P={og:'#C0DD97',blau:'#B5D4F4',spaet:'#CECBF6',gelb:'#FAC775',ft:'#F5C4B3',bzb:'#D8C4F0',ap:'#B8E8D4',metz:'#FFD5B0',baeck:'#F9E4B7',neutral:'#E8E8E8'}

  function tFracP(t){try{const[h,m]=t.split(':').map(Number);return(h+m/60-T0)/TR}catch{return 0}}
  function calcHP(s,e){try{const[sh,sm]=s.split(':').map(Number);const[eh,em]=e.split(':').map(Number);const b=(eh*60+em-sh*60-sm)/60;return b>6?b-0.5:b}catch{return 0}}
  function fmtHP(h){if(h<=0)return'';const m=Math.round((h%1)*60);return m?`${Math.floor(h)},${String(m).padStart(2,'0')}`:`${Math.floor(h)}`}

  const dates=DAYS.map((_,di)=>getDateStr(curKW,di))
  const dayNotesList=DAYS.map((_,di)=>dayNotes[curKW+'_'+di]||'')

  // Gesamtstunden vorberechnen
  let grandTot=0, grandDay=[0,0,0,0,0,0]
  maList.forEach(ma=>{
    let wh=0
    ma_tage_loop: for(let di=0;di<6;di++){
      const t=getEffectiveShift(curKW,ma.id,di)
      if(t.t==='work'&&t.s&&t.e){
        let h=ma.isMack?(t.f2==='bzb'&&t.s2&&t.e2?4:8):calcHP(t.s,t.e)+(t.s2&&t.e2?calcHP(t.s2,t.e2):0)
        wh+=h; grandDay[di]+=h
      }
    }
    grandTot+=wh
  })

  function buildBar(t){
    const typ=t.t||'fz'
    let bar=`<div style="position:relative;width:100%;height:13px;background:#F0EEE9;border:0.3px solid #CCCCCA;border-radius:2px;overflow:visible">`
    // Ticks
    for(let hr=T0;hr<=T1;hr+=2){
      const x=(hr-T0)/TR*100
      bar+=`<div style="position:absolute;left:${x}%;top:0;width:0.3px;height:100%;background:#DDDDDA"></div>`
    }
    if((typ==='work'||typ==='bzb'||typ==='ap'||typ==='metz'||typ==='baeck'||typ==='neutral')&&t.s&&t.e){
      const l=tFracP(t.s)*100, w=(tFracP(t.e)-tFracP(t.s))*100
      const bg=FARBEN_P[t.f]||'#B5D4F4'
      bar+=`<div style="position:absolute;left:${l}%;width:${w}%;top:0;height:100%;background:${bg};border:0.4px solid #AAAAAA;display:flex;align-items:center;justify-content:center">
        <span style="font-size:5.5px;font-weight:700;color:#333;white-space:nowrap;overflow:hidden">${t.s}-${t.e}</span></div>`
      if(t.s2&&t.e2){
        const l2=tFracP(t.s2)*100, w2=(tFracP(t.e2)-tFracP(t.s2))*100
        const bg2=FARBEN_P[t.f2]||'#D8C4F0'
        bar+=`<div style="position:absolute;left:${l2}%;width:${w2}%;top:0;height:100%;background:${bg2};border:0.4px solid #AAAAAA;display:flex;align-items:center;justify-content:center">
          <span style="font-size:5px;font-weight:700;color:#333">${t.s2}-${t.e2}</span></div>`
      }
    } else if(typ==='ft'){
      bar+=`<div style="position:absolute;inset:0;background:#F5C4B3;display:flex;align-items:center;justify-content:center"><span style="font-size:6px;font-weight:700;color:#8B2500">Feiertag</span></div>`
    } else if(typ==='url'){
      bar+=`<div style="position:absolute;inset:0;background:#FAECE7;display:flex;align-items:center;justify-content:center"><span style="font-size:6px;font-weight:700;color:#712B13">Urlaub</span></div>`
    } else if(typ==='bs'){
      bar+=`<div style="position:absolute;inset:0;background:#FAC775;display:flex;align-items:center;justify-content:center"><span style="font-size:6px;font-weight:700;color:#633806">BS</span></div>`
    } else if(typ==='krank'){
      bar+=`<div style="position:absolute;inset:0;background:#FFEBEE;display:flex;align-items:center;justify-content:center"><span style="font-size:6px;font-weight:700;color:#B71C1C">Krank</span></div>`
    } else {
      bar+=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><span style="font-size:6px;color:#999">FZ</span></div>`
    }
    bar+=`</div>`
    return bar
  }

  function buildTableHTML(maSubset, pageNum, totalPages, showSum){
    const kw_label=`KW ${curKW}`
    let h=`
    <div style="margin-bottom:5px">
      <span style="font-size:13px;font-weight:700;color:#333">FK Nr. 26  |  Einsatzplanung ${kw_label}  |  ${dates[0]} – ${dates[5]}</span>
      <span style="font-size:10px;color:#888;margin-left:12px">Seite ${pageNum}/${totalPages}</span>
    </div>
    <table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:8px">
      <colgroup>
        <col style="width:20px">
        <col style="width:60px">`
    for(let i=0;i<6;i++) h+=`<col style="width:auto"><col style="width:22px">`
    h+=`<col style="width:26px"></colgroup><thead><tr style="background:#F0EEE9">`
    h+=`<th style="padding:3px;border:0.3px solid #CCCCCA;text-align:center">#</th>`
    h+=`<th style="padding:3px;border:0.3px solid #CCCCCA;text-align:left">Name</th>`
    for(let di=0;di<6;di++){
      const note=dayNotesList[di]
      const noteBg=note?'background:#FFF8DC;border-bottom:2px solid #F0C040':'background:#F0EEE9'
      h+=`<th colspan="2" style="padding:3px 2px;border:0.3px solid #CCCCCA;text-align:center;${noteBg}">
        <div style="font-weight:700;font-size:8px">${DAYS[di]}</div>
        <div style="font-size:6.5px;color:#666">${dates[di]}</div>
        ${note?`<div style="font-size:6px;color:#7B5800">📌 ${note}</div>`:''}
      </th>`
    }
    h+=`<th style="padding:3px;border:0.3px solid #CCCCCA;text-align:center;background:#F0EEE9;font-size:7.5px">Std/<br>Wo</th></tr></thead><tbody>`

    maSubset.forEach((ma,i)=>{
      const bg=i%2===0?'#fff':'#F8F7F4'
      let wh=0
      h+=`<tr style="background:${bg}">`
      h+=`<td style="padding:2px;border:0.3px solid #CCCCCA;text-align:center;font-weight:600;font-size:8px">${maList.indexOf(ma)+1}</td>`
      h+=`<td style="padding:3px 2px;border:0.3px solid #CCCCCA;font-weight:700;font-size:8px">${ma.name}${ma.schwanger?' 🤰':''}</td>`
      for(let di=0;di<6;di++){
        const t=getEffectiveShift(curKW,ma.id,di)
        let hh=0
        if(t.t==='work'&&t.s&&t.e){
          hh=ma.isMack?(t.f2==='bzb'&&t.s2&&t.e2?4:8):calcHP(t.s,t.e)+(t.s2&&t.e2?calcHP(t.s2,t.e2):0)
        }
        wh+=hh
        const bem=t.bem||''
        h+=`<td style="padding:2px;border:0.3px solid #CCCCCA;vertical-align:middle">
          ${bem?`<div style="font-size:7px;color:#333;margin-bottom:2px;line-height:1.3">${bem}</div>`:''}
          ${buildBar(t)}
        </td>`
        h+=`<td style="padding:2px;border:0.3px solid #CCCCCA;text-align:center;font-size:7.5px;color:#555">${fmtHP(hh)}</td>`
      }
      h+=`<td style="padding:2px;border:0.3px solid #CCCCCA;text-align:center;font-weight:700;font-size:8.5px">${fmtHP(wh)||'–'}</td>`
      h+=`</tr>`
    })

    if(showSum){
      h+=`<tr style="background:#E8F5E9;font-weight:700">`
      h+=`<td style="padding:3px;border:0.3px solid #CCCCCA;border-top:1.5px solid #4a7c20"></td>`
      h+=`<td style="padding:3px;border:0.3px solid #CCCCCA;border-top:1.5px solid #4a7c20;font-size:8px;color:#2D5016">GESAMT</td>`
      for(let di=0;di<6;di++){
        const cnt=maList.filter(ma=>['work','bzb','ap','metz','baeck','neutral'].includes(getEffectiveShift(curKW,ma.id,di).t)).length
        h+=`<td style="padding:3px;border:0.3px solid #CCCCCA;border-top:1.5px solid #4a7c20;text-align:center;font-size:8px;color:#333">${cnt} MA</td>`
        h+=`<td style="padding:3px;border:0.3px solid #CCCCCA;border-top:1.5px solid #4a7c20;text-align:center;font-size:8px;color:#2D5016">${grandDay[di]>0?fmtHP(grandDay[di])+'h':''}</td>`
      }
      h+=`<td style="padding:3px;border:0.3px solid #CCCCCA;border-top:1.5px solid #4a7c20;text-align:center;font-size:9px;color:#2D5016">${fmtHP(grandTot)}h</td>`
      h+=`</tr>`
    }

    h+=`</tbody></table>`
    h+=`<div style="margin-top:5px;font-size:7.5px;color:#999">Die Zeitangaben sind verbindlich. Änderungen nur nach Absprache.</div>`
    return h
  }

  const mid=Math.ceil(maList.length/2)
  const page1=maList.slice(0,mid)
  const page2=maList.slice(mid)

  const html=`<!DOCTYPE html><html><head><meta charset="utf-8">
  <title>Schichtplan KW ${curKW}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Helvetica,Arial,sans-serif;background:#fff;color:#333}
    @page{size:A4 landscape;margin:6mm}
    @media print{
      html,body{width:297mm}
      .page{page-break-after:always}
      .page:last-child{page-break-after:avoid}
    }
    .page{padding:6mm;width:297mm}
  </style>
  </head><body>
  <div class="page">${buildTableHTML(page1,1,2,false)}</div>
  <div class="page">${buildTableHTML(page2,2,2,true)}</div>
  <script>window.addEventListener('load',()=>setTimeout(()=>window.print(),400))<\/script>
  </body></html>`

  const blob=new Blob([html],{type:'text/html;charset=utf-8'})
  const url=URL.createObjectURL(blob)
  const w=window.open(url,'_blank')
  if(!w) alert('Bitte Pop-ups für diese Seite erlauben!')
  setTimeout(()=>URL.revokeObjectURL(url),10000)
}

// === openBemPopup ===
function openBemPopup(maId, di, field){
  const ma=maList.find(m=>m.id==maId); if(!ma) return
  const t=getEffectiveShift(curKW,ma.id,di)
  const cur = field==='bem' ? (t.bem||'') : (t.bem2||'')

  const overlay=document.createElement('div')
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:16px'
  overlay.innerHTML=`
    <div style="background:var(--bg);border-radius:16px 16px 12px 12px;padding:20px;width:100%;max-width:480px;box-shadow:0 -4px 24px rgba(0,0,0,0.2)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="font-weight:600;font-size:15px;color:var(--text)">${ma.name} – Aufgabe</div>
        <button onclick="this.closest('div').parentElement.parentElement.remove()" style="background:none;border:none;font-size:22px;color:var(--text3);cursor:pointer;padding:0 4px">✕</button>
      </div>
      <textarea id="bem-popup-input" style="width:100%;height:100px;padding:10px;font-size:15px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);resize:vertical;font-family:inherit;outline:none" placeholder="Aufgaben eingeben z.B. O&G + Kasse + Laden...">${cur}</textarea>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button onclick="
          const val=document.getElementById('bem-popup-input').value;
          updateBem('${maId}',${di},val,'${field}');
          this.closest('div').parentElement.parentElement.remove();
        " style="flex:1;padding:12px;background:var(--accent);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer">Speichern</button>
        <button onclick="this.closest('div').parentElement.parentElement.remove()" style="padding:12px 20px;background:var(--bg2);color:var(--text2);border:1px solid var(--border);border-radius:var(--radius);font-size:15px;cursor:pointer">Abbrechen</button>
      </div>
    </div>`
  document.body.appendChild(overlay)
  // Fokus auf Textarea
  setTimeout(()=>document.getElementById('bem-popup-input').focus(),100)
}

function updateBem(maId,di,val,field='bem'){
  const ma=maList.find(m=>m.id==maId); if(!ma) return
  const cur=getEffectiveShift(curKW,ma.id,di)
  const upd={...cur,[field]:val}
  setShift(curKW,ma.id,di,upd)
  renderTag(); renderStats()
}

// === NAV ===
function changeKW(delta){
  curKW+=delta;if(curKW<1)curKW=1
  ignoredConflicts.clear()
  document.getElementById('kw-label').textContent='KW '+curKW
  document.getElementById('nav-title').textContent='Schichtplan KW '+curKW
  renderAll()
}

function showView(v){
  curView=v
  ;['woche','tag','ausn','ma','std'].forEach(id=>{
    document.getElementById('view-'+id).style.display=id===v?'':'none'
    document.getElementById('tab-'+id).className='tab'+(id===v?' aktiv':'')
  })
  if(v==='woche')renderWoche()
  else if(v==='tag')renderTag()
  else if(v==='ausn')renderAusn()
  else if(v==='ma')renderMA()
  else if(v==='std')renderStd()
}

function renderAll(){
  renderStats();renderConflicts()
  if(curView==='woche')renderWoche()
  else if(curView==='tag')renderTag()
  else if(curView==='ausn')renderAusn()
  else if(curView==='ma')renderMA()
  else if(curView==='std')renderStd()
}

function closeModal(){document.getElementById('modal').style.display='none'}

// Init
loadState()
renderAll()
</script>
