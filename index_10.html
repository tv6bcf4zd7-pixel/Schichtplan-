<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Schichtplan App</title>

<style>
:root {
  --bg:#F8F7F4;--bg2:#FFFFFF;--bg3:#F0EEE9;--text:#1A1917;--text2:#6B6860;--text3:#A8A59E;
  --border:#E2DED6;--border2:#C8C4BA;--accent:#2D5016;--accent-bg:#EAF3DE;
  --danger:#A32D2D;--danger-bg:#FCEBEB;--warn:#633806;--warn-bg:#FAEEDA;
  --info:#0C447C;--info-bg:#E6F1FB;--radius:10px;--radius-sm:6px;
  --col-og:#C0DD97;--col-spaet:#CECBF6;--col-blau:#B5D4F4;--col-gelb:#FAC775;--col-ft:#F5C4B3;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1A1917;--bg2:#252420;--bg3:#2E2C28;--text:#F0EDE6;--text2:#A8A59E;--text3:#6B6860;
  --border:#3A3830;--border2:#4A4840;--accent:#97C459;--accent-bg:#1A2E08;
  --danger:#E24B4A;--danger-bg:#2A0F0F;--warn:#EF9F27;--warn-bg:#2A1A04;--info:#378ADD;--info-bg:#041929;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;height:52px}
.nav-title{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw-ctrl{display:flex;align-items:center;gap:4px}
.kw-ctrl button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kw-ctrl span{font-size:12px;font-weight:600;min-width:48px;text-align:center}
.nav-btns{display:flex;gap:4px}
.nbtn{padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
.nbtn.primary{background:var(--accent);color:white;border-color:transparent}
.nbtn.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.tab.aktiv{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:10px;max-width:1200px;margin:0 auto}
.saved-badge{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--accent-bg);color:var(--accent);display:none}
.saved-badge.show{display:inline-block}

/* Conflict banner */
.conflict-banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.conflict-banner .conflict-list{flex:1;font-size:12px;color:var(--warn)}
.conflict-banner .conflict-list li{margin-bottom:3px}
.conflict-banner .ignore-btn{font-size:11px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--warn);background:var(--bg);color:var(--warn);cursor:pointer;white-space:nowrap;flex-shrink:0}

/* Stats */
.stats{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stats::-webkit-scrollbar{display:none}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;flex-shrink:0;min-width:80px}
.stat-label{font-size:10px;color:var(--text2);margin-bottom:2px}
.stat-val{font-size:18px;font-weight:600}

/* Week table */
.week-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);border:1px solid var(--border)}
.week-table{min-width:660px;border-collapse:collapse;width:100%}
.week-table th{background:var(--bg3);font-size:11px;font-weight:600;text-align:center;padding:6px 4px;border:1px solid var(--border);color:var(--text2);cursor:pointer}
.week-table th:first-child{text-align:left;padding-left:8px;min-width:105px;cursor:default}
.week-table th:hover:not(:first-child){background:var(--accent-bg);color:var(--accent)}
.week-table td{border:1px solid var(--border);padding:2px 3px;vertical-align:top;height:52px;position:relative}
.week-table td:first-child{padding:4px 8px;background:var(--bg2)}
.ma-name-c{font-size:11px;font-weight:600}
.ma-soll-c{font-size:10px;color:var(--text3)}
.mini-tl{position:relative;height:22px;background:var(--bg3);border-radius:4px;overflow:hidden;cursor:pointer}
.mini-bar{position:absolute;height:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mini-bar span{font-size:9px;font-weight:600;color:#333;white-space:nowrap;padding:0 3px}
.mini-fz{display:flex;align-items:center;justify-content:center;height:22px;font-size:10px;color:var(--text3)}
.mini-url{display:flex;align-items:center;justify-content:center;height:22px;font-size:10px;font-weight:600;color:#712B13;background:#FAECE7;border-radius:4px}
.mini-bs{display:flex;align-items:center;justify-content:center;height:22px;font-size:10px;font-weight:600;color:#633806;background:#FAEEDA;border-radius:4px}
.mini-ausn{border:2px dashed var(--warn);border-radius:4px}
.diff-pos{color:var(--danger)}.diff-neg{color:var(--info)}.diff-ok{color:var(--accent)}

/* Day editor */
.day-tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{padding:7px 12px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.day-tab.aktiv{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.day-editor{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.ma-edit-row{padding:10px 12px;border-bottom:1px solid var(--border)}
.ma-edit-row:last-child{border-bottom:none}
.ma-edit-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ma-edit-name{font-size:13px;font-weight:600;flex:1}
.ma-std{font-size:12px;font-weight:500;color:var(--text2)}
.ausn-badge{font-size:9px;padding:2px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.status-pills{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.pill{font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);cursor:pointer;font-weight:500;color:var(--text2);background:var(--bg)}
.pill.on-work{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.pill.on-fz{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.pill.on-url{background:#FAECE7;color:#712B13;border-color:#F5C4B3}
.pill.on-bs{background:var(--warn-bg);color:var(--warn);border-color:#FAC775}
.pill.on-ft{background:#F5C4B3;color:#712B13;border-color:#F0997B}
.pill.on-krank{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}

/* Timeline */
.timeline{position:relative;height:34px;background:var(--bg3);border-radius:var(--radius-sm);margin:4px 0;overflow:visible}
.tl-bar{position:absolute;height:100%;border-radius:var(--radius-sm);cursor:grab;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
.tl-bar:active{cursor:grabbing;opacity:.85}
.tl-handle{position:absolute;top:0;width:10px;height:100%;cursor:ew-resize;z-index:3;background:rgba(0,0,0,.12)}
.tl-handle-l{left:0;border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.tl-handle-r{right:0;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.tl-label{font-size:10px;font-weight:700;color:#333;pointer-events:none;white-space:nowrap}
.tl-tick{position:absolute;top:0;width:.5px;height:100%;background:var(--border);pointer-events:none}
.tl-tick-l{position:absolute;bottom:-14px;font-size:8px;color:var(--text3);transform:translateX(-50%);pointer-events:none}
.time-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px}
.time-row input[type=time]{font-size:11px;padding:3px 5px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text)}
.time-row select{font-size:11px;padding:3px 5px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text)}
.time-row input[type=text]{font-size:11px;padding:3px 7px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);flex:1;min-width:100px}
.no-work-cell{height:34px;background:var(--bg3);border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--text3);margin:4px 0}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:500px){.modal-bg{align-items:center;padding:16px}}
.modal{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
@media(min-width:500px){.modal{border-radius:var(--radius)}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px}
.field{margin-bottom:10px}
.field label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.field textarea{min-height:60px;resize:vertical}
.komp-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.komp-chip{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);cursor:pointer;color:var(--text2);background:var(--bg)}
.komp-chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:white;border-color:transparent}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}

/* MA list */
.ma-list{display:flex;flex-direction:column;gap:6px}
.ma-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px}
.ma-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ma-info{flex:1}
.ma-info-name{font-size:13px;font-weight:600}
.ma-info-detail{font-size:10px;color:var(--text2);margin-top:1px}
.komp-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.komp-tag{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--bg3);color:var(--text2)}
.ma-actions{display:flex;gap:5px}
.icon-btn{width:30px;height:22px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Stammdaten */
.stamm-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.stamm-header{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.stamm-grid{display:grid;grid-template-columns:80px 1fr;gap:4px 8px;font-size:12px;align-items:center}
.stamm-label{color:var(--text2)}

/* Stunden */
.std-table{width:100%;border-collapse:collapse}
.std-table th{font-size:11px;font-weight:600;text-align:left;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.std-table td{font-size:12px;padding:7px 8px;border:1px solid var(--border)}
.std-bar-wrap{height:6px;background:var(--bg3);border-radius:999px;overflow:hidden;margin-top:2px}
.std-bar-fill{height:100%;border-radius:999px}

/* Ausnahmen */
.ausn-list{display:flex;flex-direction:column;gap:6px}
.ausn-item{background:var(--bg2);border:1px solid var(--warn);border-radius:var(--radius-sm);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px}
.ausn-item .ausn-del{margin-left:auto;cursor:pointer;color:var(--danger);font-size:16px}

.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:3px}
.farbe-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.section-title{font-size:13px;font-weight:600;margin-bottom:8px;margin-top:14px;color:var(--text)}
</style>
</head>
<body>

<div class="nav">
  <span class="nav-title" id="nav-title">Schichtplan</span>
  <span class="saved-badge" id="saved-badge">✓ Gespeichert</span>
  <div class="kw-ctrl">
    <button onclick="changeKW(-1)">‹</button>
    <span id="kw-label">KW 21</span>
    <button onclick="changeKW(1)">›</button>
  </div>
  <div class="nav-btns">
    <button class="nbtn warn" onclick="exportForClaude()">📋 PDF via Claude</button>
    <button class="nbtn" onclick="exportData()" title="Daten exportieren">💾 Export</button>
    <button class="nbtn" onclick="document.getElementById('importFile').click()" title="Daten importieren">📂 Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="nbtn primary" onclick="showAddMA()">+ MA</button>
  </div>
</div>

<div class="tabs">
  <div class="tab aktiv" id="tab-woche" onclick="showView('woche')">Woche</div>
  <div class="tab" id="tab-tag" onclick="showView('tag')">Tag</div>
  <div class="tab" id="tab-ausn" onclick="showView('ausn')">Ausnahmen</div>
  <div class="tab" id="tab-ma" onclick="showView('ma')">Mitarbeiter</div>
  <div class="tab" id="tab-std" onclick="showView('std')">Stunden</div>
</div>

<div class="main">
  <div id="conflict-area"></div>
  <div class="stats" id="stats-row"></div>
  <div id="view-woche"></div>
  <div id="view-tag" style="display:none"></div>
  <div id="view-ausn" style="display:none"></div>
  <div id="view-ma" style="display:none"></div>
  <div id="view-std" style="display:none"></div>
</div>

<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

// State
let maList=JSON.parse(JSON.stringify(defaultMA))
let shifts={}  // {kw: {maId: [tage]}}
let ausnahmen={} // {kw: [{maId, dayIdx, grund, notiz}]}
let loaded=false

function loadState(){
  try{
    const ms=localStorage.getItem('sp_ma'); if(ms)maList=JSON.parse(ms)
    const ss=localStorage.getItem('sp_shifts'); if(ss)shifts=JSON.parse(ss)
    const as=localStorage.getItem('sp_ausn'); if(as)ausnahmen=JSON.parse(as)
    loaded=true
  }catch(e){loaded=true}
  // Init KW21 if not saved
  if(!shifts[21]){
    shifts[21]={}
    maList.forEach(ma=>{
      const key=`k${ma.id}`
      const ov=kw21Overrides.find(o=>o.maId===ma.id)
      if(ov){shifts[21][key]=ov.tage}
      else{shifts[21][key]=Array(6).fill(null)}
    })
  }
}

function saveState(){
  try{
    localStorage.setItem('sp_ma',JSON.stringify(maList))
    localStorage.setItem('sp_shifts',JSON.stringify(shifts))
    localStorage.setItem('sp_ausn',JSON.stringify(ausnahmen))
    const b=document.getElementById('saved-badge')
    b.classList.add('show')
    setTimeout(()=>b.classList.remove('show'),2000)
  }catch(e){}
}

function getDayKey(di){return['mo','di','mi','do','fr','sa'][di]}

function getShift(kw,maId,di){
  const key=`k${maId}`
  if(!shifts[kw])return null
  const arr=shifts[kw][key]
  if(!arr)return null
  return arr[di]
}

function setShift(kw,maId,di,val){
  const key=`k${maId}`
  if(!shifts[kw])shifts[kw]={}
  if(!shifts[kw][key])shifts[kw][key]=Array(6).fill(null)
  shifts[kw][key][di]=val
  saveState()
}

function getEffectiveShift(kw,maId,di){
  // Check ausnahme first
  const ausn=getAusnahme(kw,maId,di)
  if(ausn)return {t:ausn.typ||'fz', _ausnahme:true, bem:ausn.notiz||''}
  const ov=getShift(kw,maId,di)
  if(ov!==null&&ov!==undefined)return ov
  // Fall back to Stammdaten
  const ma=maList.find(m=>m.id===maId)
  if(!ma||!ma.stamm)return{t:'fz'}
  const dk=getDayKey(di)
  const st=ma.stamm[dk]
  if(!st)return{t:'fz'}
  if(st.s&&st.e)return{t:'work',s:st.s,e:st.e,f:st.f||'blau',bem:st.bem||''}
  return{t:st.t||'fz'}
}

function getAusnahme(kw,maId,di){
  if(!ausnahmen[kw])return null
  return ausnahmen[kw].find(a=>a.maId===maId&&a.dayIdx===di)||null
}

// Hours
function calcH(s,e){const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);const b=(eh*60+em-sh*60-sm)/60;return b>6?b-0.5:b}
function fmtH(h){if(h<=0)return'–';const m=Math.round((h%1)*60);return m?`${Math.floor(h)},${String(m).padStart(2,'0')}`:`${Math.floor(h)}`}
function tFrac(t){const[h,m]=t.split(':').map(Number);return(h+m/60-T0)/TR}
function toT(v){const h=Math.floor(v),m=Math.round((v-h)*60);return`${h}:${String(m).padStart(2,'0')}`}
function snapT(v){return Math.round(v*4)/4}

function getWeekArb(kw,maId){
  let total=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='work'&&t.s&&t.e)total+=calcH(t.s,t.e)}
  return Math.round(total*100)/100
}
function getWeekUrl(kw,maId,ma){
  let days=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='url')days++}
  return Math.round(days*(ma.soll/5)*100)/100
}
function getWeekFT(kw,maId,ma){
  let days=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='ft')days++}
  return Math.round(days*(ma.soll/6)*100)/100
}

// Conflict detection
function detectConflicts(){
  const conflicts=[]
  // Ruhezeit: wenn Spätschicht bis 20:15+, dann nächster Tag frühestens 7:15 (wir machen 7:30)
  maList.forEach(ma=>{
    for(let di=0;di<5;di++){
      const t=getEffectiveShift(curKW,ma.id,di)
      if(t.t==='work'&&t.e){
        const[eh,em]=t.e.split(':').map(Number)
        const endMin=eh*60+em
        const next=getEffectiveShift(curKW,ma.id,di+1)
        if(next.t==='work'&&next.s){
          const[sh,sm]=next.s.split(':').map(Number)
          const startMin=sh*60+sm
          const rest=(24*60-endMin)+startMin
          if(rest<11*60){
            const cid=`ruhe_${ma.id}_${di}`
            if(!ignoredConflicts.has(cid))
              conflicts.push({id:cid,text:`${ma.name}: Ruhezeit ${DAYS[di]} ${t.e}→${DAYS[di+1]} ${next.s} (${Math.round(rest/60*10)/10}h < 11h)`})
          }
        }
      }
    }
  })
  // Schwanger + Spät
  maList.forEach(ma=>{
    if(!ma.schwanger)return
    for(let di=0;di<6;di++){
      const t=getEffectiveShift(curKW,ma.id,di)
      if(t.t==='work'&&t.e){
        const[eh]=t.e.split(':').map(Number)
        if(eh>=19){
          const cid=`schw_${ma.id}_${di}`
          if(!ignoredConflicts.has(cid))
            conflicts.push({id:cid,text:`${ma.name} (schwanger): Spätschicht bis ${t.e} am ${DAYS[di]}`})
        }
      }
    }
  })
  // Geplanter Urlaub diese KW nicht eingetragen
  maList.forEach(ma=>{
    if(!ma.urlaube||!ma.urlaube.length)return
    ma.urlaube.forEach(u=>{
      if(curKW>=u.von&&curKW<=(u.bis||u.von)){
        const hasWork=Array.from({length:6},(_,di)=>getEffectiveShift(curKW,ma.id,di)).some(t=>t.t==='work')
        if(hasWork){
          const cid=`urlplan_${ma.id}_${curKW}`
          if(!ignoredConflicts.has(cid))
            conflicts.push({id:cid,text:`${ma.name}: Geplanter Urlaub KW ${u.von}${u.bis&&u.bis!==u.von?`–${u.bis}`:''}${u.notiz?` (${u.notiz})`:''} – aber noch Schichten eingetragen!`})
        }
      }
    })
  })
  return conflicts
}

function renderConflicts(){
  const cf=detectConflicts()
  const el=document.getElementById('conflict-area')
  if(!cf.length){el.innerHTML='';return}
  el.innerHTML=`<div class="conflict-banner">
    <div class="conflict-list"><b>⚠️ Hinweise:</b><ul style="margin-top:4px;padding-left:16px">${cf.map(c=>`<li>${c.text}</li>`).join('')}</ul></div>
    <button class="ignore-btn" onclick="ignoreAll([${cf.map(c=>`'${c.id}'`).join(',')}])">Ignorieren</button>
  </div>`
}
function ignoreAll(ids){ids.forEach(id=>ignoredConflicts.add(id));renderConflicts()}

// Bayerische Feiertage 2026 (Format: 'DD.MM.')
const FEIERTAGE_2026={
  '01.01.':'Neujahr',
  '06.01.':'Heilige Drei Könige',
  '03.04.':'Karfreitag',
  '05.04.':'Ostersonntag',
  '06.04.':'Ostermontag',
  '01.05.':'Tag der Arbeit',
  '14.05.':'Christi Himmelfahrt',
  '24.05.':'Pfingstsonntag',
  '25.05.':'Pfingstmontag',
  '04.06.':'Fronleichnam',
  '15.08.':'Mariä Himmelfahrt',
  '03.10.':'Tag der Deutschen Einheit',
  '01.11.':'Allerheiligen',
  '25.12.':'1. Weihnachtstag',
  '26.12.':'2. Weihnachtstag',
}

function getDateObj(kw,di){
  // KW1 Monday: find monday of week containing Jan 4
  const jan4=new Date(2026,0,4)
  const dow=(jan4.getDay()+6)%7 // Mon=0..Sun=6
  const kw1Monday=new Date(jan4)
  kw1Monday.setDate(jan4.getDate()-dow)
  const d=new Date(kw1Monday)
  d.setDate(kw1Monday.getDate()+(kw-1)*7+di)
  return d
}

function getDateStr(kw,di){
  const d=getDateObj(kw,di)
  return`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.`
}

function isFeiertag(kw,di){
  const dateStr=getDateStr(kw,di)
  return FEIERTAGE_2026[dateStr]||null
}

    </td>`

    for(let di=0;di<6;di++){

        const l=tFrac(t.s)*100,w=(tFrac(t.e)-tFrac(t.s))*100
        const bg=FARBEN[t.f]?FARBEN[t.f].bg:'#B5D4F4'
        html+=`<td onclick="curDay=${di};showView('tag')" style="${ftStyle}"><div class="mini-tl ${ausnCls}" title="${t.bem||''}">
          <div class="mini-bar" style="left:${l}%;width:${w}%;background:${bg}"><span>${t.s}–${t.e}</span></div>
        </div></td>`
      } else if(t.t==='url'){html+=`<td onclick="curDay=${di};showView('tag')" style="${ftStyle}"><div class="mini-url ${ausnCls}">Urlaub</div></td>`}
      else if(t.t==='ft'){html+=`<td onclick="curDay=${di};showView('tag')" style="background:#FDDCB5"><div class="mini-url" style="background:#F5C4B3;color:#712B13">FT</div></td>`}
      else if(t.t==='bs'){html+=`<td onclick="curDay=${di};showView('tag')" style="${ftStyle}"><div class="mini-bs ${ausnCls}">BS/MZ</div></td>`}
      else if(t.t==='krank'){html+=`<td onclick="curDay=${di};showView('tag')"><div class="mini-url" style="background:var(--danger-bg);color:var(--danger)">Krank</div></td>`}
      else{html+=`<td onclick="curDay=${di};showView('tag')" style="${ftStyle}"><div class="mini-fz ${ausnCls}">${t.t==='fz'?'FZ':'–'}</div></td>`}
    }
    html+=`</tr>`
  })
  html+=`</tbody></table></div>`
  el.innerHTML=html
}

// Drag
function getCXY(e){return e.touches?{x:e.touches[0].clientX}:{x:e.clientX}}
function startDrag(e,maId,mode){
  e.preventDefault()
  const tl=document.getElementById('tl_'+maId);if(!tl)return
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const t=getEffectiveShift(curKW,ma.id,curDay)
  dragState={maId,mode,rect:tl.getBoundingClientRect(),startX:getCXY(e).x,startS:t.s,startE:t.e}
  document.addEventListener('mousemove',onDrag);document.addEventListener('mouseup',stopDrag)
}
function startDragTouch(e,maId,mode){
  const tl=document.getElementById('tl_'+maId);if(!tl)return
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const t=getEffectiveShift(curKW,ma.id,curDay)
  dragState={maId,mode,rect:tl.getBoundingClientRect(),startX:getCXY(e).x,startS:t.s,startE:t.e}
  document.addEventListener('touchmove',onDrag,{passive:false});document.addEventListener('touchend',stopDrag)
}
function onDrag(e){
  if(!dragState)return;if(e.cancelable)e.preventDefault()
  const{maId,mode,rect,startX,startS,startE}=dragState
  const dx=(getCXY(e).x-startX)/rect.width
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const t=getEffectiveShift(curKW,ma.id,curDay)
  const[sh,sm]=startS.split(':').map(Number),[eh,em]=startE.split(':').map(Number)
  const dur=(eh*60+em-sh*60-sm)/60
  let ns,ne
  if(mode==='move'){ns=snapT((sh+sm/60-T0)+dx*TR);ns=Math.max(0,Math.min(TR-dur,ns));ne=ns+dur;t.s=toT(T0+ns);t.e=toT(T0+ne)}
  else if(mode==='left'){ns=snapT((sh+sm/60-T0)+dx*TR);ns=Math.max(0,Math.min((eh+em/60-T0)-.25,ns));t.s=toT(T0+ns)}
  else{ne=snapT((eh+em/60-T0)+dx*TR);ne=Math.max((sh+sm/60-T0)+.25,Math.min(TR,ne));t.e=toT(T0+ne)}
  const bar=document.getElementById('bar_'+maId)
  if(bar){bar.style.left=tFrac(t.s)*100+'%';bar.style.width=(tFrac(t.e)-tFrac(t.s))*100+'%';const lbl=document.getElementById('lbl_'+maId);if(lbl)lbl.textContent=t.s+'–'+t.e}
  const std=document.getElementById('std_'+maId)
  if(std)std.textContent=(ma.isMack?'8':fmtH(calcH(t.s,t.e)))+' Std.'
}
function stopDrag(){
  if(!dragState)return
  const{maId}=dragState
  const ma=maList.find(m=>m.id==maId)
  if(ma){const t=getEffectiveShift(curKW,ma.id,curDay);setShift(curKW,ma.id,curDay,{...t})}
  dragState=null
  document.removeEventListener('mousemove',onDrag);document.removeEventListener('mouseup',stopDrag)
  document.removeEventListener('touchmove',onDrag);document.removeEventListener('touchend',stopDrag)
  renderConflicts()
}

// === STUNDEN ===
function renderStd(){
  const el=document.getElementById('view-std')
  const rows=maList.map(ma=>{
    const arb=getWeekArb(curKW,ma.id)
    const url=getWeekUrl(curKW,ma.id,ma)
    const ft=getWeekFT(curKW,ma.id,ma)
    const total=arb+url+ft
    const diff=Math.round((total-ma.soll)*100)/100
    return{ma,arb,url,ft,total,diff}
  }).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff))

  let html=`<table class="std-table"><thead><tr><th>Name</th><th>Arb.</th><th>URL</th><th>FT</th><th>Soll</th><th>Diff</th><th style="min-width:70px">Auslastung</th></tr></thead><tbody>`
  rows.forEach(({ma,arb,url,ft,diff})=>{
    const dA=ma.isMack?8:arb
    const dDiff=ma.isMack?Math.round((8-ma.soll)*100)/100:diff
    const dTotal=ma.isMack?8:(arb+url+ft)
    const pct=Math.min(100,Math.round(dTotal/ma.soll*100))||0
    const barCol=dDiff>2?'#E24B4A':dDiff<-2?'#378ADD':'#97C459'
    const diffCls=dDiff>1?'diff-pos':dDiff<-1?'diff-neg':'diff-ok'
    html+=`<tr>
      <td style="font-weight:600">${ma.name}${ma.schwanger?' 🤰':''}</td>
      <td>${fmtH(dA)}</td><td>${url>0?fmtH(url):'–'}</td><td>${ft>0?fmtH(ft):'–'}</td>
      <td>${ma.soll}</td>
      <td class="${diffCls}" style="font-weight:600">${dDiff>=0?'+':''}${dDiff}</td>
      <td><div class="std-bar-wrap"><div class="std-bar-fill" style="width:${pct}%;background:${barCol}"></div></div><span style="font-size:10px;color:var(--text3)">${pct}%</span></td>
    </tr>`
  })
  html+=`</tbody></table>`
  el.innerHTML=html
}

    dateFrom: getDateStr(curKW,0),
    dateTo: getDateStr(curKW,5),
    mitarbeiter: maList.map(ma => {
      const tage = Array.from({length:6},(_,di) => {
        const t = getEffectiveShift(curKW, ma.id, di)
        const ft = isFeiertag(curKW, di)
        return {
          tag: DAYS[di],
          datum: getDateStr(curKW,di),
          feiertag: ft||null,
          ...t
        }
      })
      return {
        id: ma.id,
        name: ma.name,
        soll: ma.soll,
        isMack: ma.isMack||false,
        schwanger: ma.schwanger||false,
        tage: tage,
        wochenstunden: ma.isMack?8:getWeekArb(curKW,ma.id)
      }
    })
  }

  const json = JSON.stringify(weekData, null, 2)
  const blob = new Blob([json], {type:'application/json'})
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = `KW${curKW}_fuer_Claude.json`
  document.body.appendChild(a)
  a.click()
  setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a)},1000)

  // Show instructions
  const modal = document.createElement('div')
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px'
  modal.innerHTML = `<div style="background:white;border-radius:12px;padding:20px;max-width:360px;text-align:center">
    <div style="font-size:32px;margin-bottom:8px">📋</div>
    <div style="font-size:15px;font-weight:600;margin-bottom:8px">Datei wurde heruntergeladen!</div>
    <div style="font-size:13px;color:#555;margin-bottom:16px;line-height:1.5">
      1. Geh zu Claude.ai<br>
      2. Lade die Datei <strong>KW${curKW}_fuer_Claude.json</strong> hoch<br>
      3. Schreib: <em>"Bitte PDF für KW ${curKW} generieren"</em>
    </div>
    <button onclick="this.closest('div').parentElement.remove()" style="padding:10px 24px;background:#2D5016;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer">OK</button>
  </div>`
  document.body.appendChild(modal)
}

// === PDF EXPORT ===
function exportPDF(){
  const T0=6,T1=22,TR=T1-T0
  const COLS_PDF={og:'#C0DD97',blau:'#B5D4F4',spaet:'#CECBF6',gelb:'#FAC775',ft:'#F5C4B3'}

  const rows = maList.map((ma,mi) => {
    const cells = Array.from({length:6},(_,di) => {
      const t = getEffectiveShift(curKW, ma.id, di)
      const ftDay = isFeiertag(curKW, di)
      const cellBg = ftDay ? '#FFF3E0' : (mi%2===0?'#FAFAF8':'white')

      if(t.t==='work'&&t.s&&t.e){
        const l = tFrac(t.s)*100
        const w = (tFrac(t.e)-tFrac(t.s))*100
        const bg = COLS_PDF[t.f]||'#B5D4F4'
        const nh = calcH(t.s,t.e)
        const dispH = ma.isMack?'8':fmtH(nh)

        const ticks = Array.from({length:9},(_,i)=>{
          const hh=T0+i*2, p=(hh-T0)/TR*100
          return `<div style="position:absolute;left:${p}%;top:0;width:0.5px;height:100%;background:rgba(0,0,0,0.15)"></div>
                  <div style="position:absolute;left:${p}%;bottom:-8px;font-size:4.5px;color:#bbb;transform:translateX(-50%)">${hh}</div>`
        }).join('')

        const words=(t.bem||'').split(' + ')
        let aufgabe
        if(words.length<=2){
          aufgabe=`<div style="font-size:6.5px;font-weight:500;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px">${t.bem||''}</div>`
        } else {
          const mid=Math.ceil(words.length/2)
          aufgabe=`<div style="font-size:6px;font-weight:500;color:#222;line-height:1.4;margin-bottom:2px">
            <div style="white-space:nowrap;overflow:hidden">${words.slice(0,mid).join(' + ')}</div>
            <div style="white-space:nowrap;overflow:hidden">${words.slice(mid).join(' + ')}</div>
          </div>`
        }

        return `<td style="background:${cellBg};padding:2px 3px;vertical-align:top;border:0.5px solid #ccc;border-right:none">
          ${aufgabe}
          <div style="position:relative;height:13px;background:#f0ede9;border-radius:2px;margin-bottom:10px">${ticks}
            <div style="position:absolute;left:${l}%;width:${w}%;height:100%;background:${bg};border-radius:2px;display:flex;align-items:center;justify-content:center;overflow:hidden">
              <span style="font-size:7.5px;font-weight:700;color:#333;white-space:nowrap;padding:0 2px">${t.s}–${t.e}</span>
            </div>
          </div>
        </td><td style="font-size:7.5px;font-weight:500;text-align:center;border:0.5px solid #ccc;vertical-align:middle;background:${cellBg};white-space:nowrap;padding:0 2px;min-width:16px">${dispH}</td>`

      } else if(t.t==='url'){
        return `<td style="background:#FAECE7;border:0.5px solid #ccc;border-right:none;text-align:center;vertical-align:middle"><div style="font-size:7px;font-weight:700;color:#712B13">Urlaub</div></td><td style="font-size:7px;text-align:center;border:0.5px solid #ccc;color:#aaa;background:#FAECE7;min-width:16px">U</td>`
      } else if(t.t==='ft'){
        return `<td style="background:#F5C4B3;border:0.5px solid #ccc;border-right:none;text-align:center;vertical-align:middle"><div style="font-size:7px;font-weight:700;color:#712B13">Feiertag</div></td><td style="font-size:7px;text-align:center;border:0.5px solid #ccc;color:#712B13;background:#F5C4B3;min-width:16px">FT</td>`
      } else if(t.t==='bs'){
        return `<td style="background:#FAEEDA;border:0.5px solid #ccc;border-right:none;text-align:center;vertical-align:middle"><div style="font-size:7px;font-weight:700;color:#633806">BS/MZ</div></td><td style="font-size:7px;text-align:center;border:0.5px solid #ccc;color:#633806;background:#FAEEDA;min-width:16px">BS</td>`
      } else if(t.t==='krank'){
        return `<td style="background:#FCEBEB;border:0.5px solid #ccc;border-right:none;text-align:center;vertical-align:middle"><div style="font-size:7px;font-weight:700;color:#A32D2D">Krank</div></td><td style="font-size:7px;text-align:center;border:0.5px solid #ccc;background:#FCEBEB;min-width:16px"></td>`
      } else {
        return `<td style="background:${cellBg};border:0.5px solid #ccc;border-right:none;text-align:center;vertical-align:middle"><div style="font-size:7px;color:#bbb">FZ</div></td><td style="border:0.5px solid #ccc;background:${cellBg};min-width:16px"></td>`
      }
    }).join('')

    const weekArb = getWeekArb(curKW, ma.id)
    const dispW = ma.isMack?'8':fmtH(weekArb)
    return `<tr style="border-bottom:1px solid #bbb">
      <td style="font-size:7px;color:#999;text-align:center;padding:0 2px;border:0.5px solid #ccc;width:14px">${ma.id}</td>
      <td style="font-size:8px;font-weight:700;padding:2px 4px;border:0.5px solid #ccc;white-space:nowrap;background:${mi%2===0?'#FAFAF8':'white'};min-width:52px">${ma.name}${ma.schwanger?' 🤰':''}</td>
      ${cells}
      <td style="font-size:8px;font-weight:700;text-align:center;border:0.5px solid #ccc;border-left:2px solid #888;background:#f0ede9;min-width:22px">${dispW||'–'}</td>
    </tr>`
  }).join('')

  const headers = DAYS.map((d,i) => {
    const ft = isFeiertag(curKW,i)
    const bg = ft ? '#FDDCB5' : '#E8E8E8'
    const col = ft ? '#712B13' : '#444'
    return `<th colspan="2" style="font-size:7px;padding:3px 2px;background:${bg};color:${col};border:0.5px solid #ccc;text-align:center;font-weight:600">
      ${d} <span style="font-weight:400">${getDateStr(curKW,i)}</span>${ft?' 🎉 '+ft:''}
    </th>`
  }).join('')

  const subHeaders = DAYS.map(()=>
    `<th style="font-size:5.5px;padding:1px 2px;background:#EEECEA;border:0.5px solid #ccc;color:#888;text-align:center;font-weight:400">Schicht</th>
     <th style="font-size:5.5px;padding:1px;background:#EEECEA;border:0.5px solid #ccc;color:#888;text-align:center;font-weight:400">Std</th>`
  ).join('')

  const legend = [
    {c:'#C0DD97',l:'O&G'},{c:'#B5D4F4',l:'Bereiche'},{c:'#CECBF6',l:'Spät'},
    {c:'#FAC775',l:'BS/MZ'},{c:'#F5C4B3',l:'Feiertag/Urlaub'}
  ].map(({c,l})=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:14px">
    <span style="display:inline-block;width:16px;height:10px;background:${c};border-radius:2px;border:0.5px solid #ccc"></span>
    <span style="font-size:7.5px;color:#444">${l}</span>
  </span>`).join('')

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>
    @page { size: A4 landscape; margin: 6mm; }
    html,body { margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;font-size:7px;width:285mm;overflow:hidden }
    table { width:100%;border-collapse:collapse;table-layout:fixed }
    * { -webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box }
    @media screen { body { background:#f5f5f5;padding:10px } .print-wrap { background:white;padding:6mm;width:285mm;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,0.15) } }
    @media print { .print-btn { display:none!important } }
  </style></head><body>
  <div style="position:fixed;top:10px;right:10px;z-index:999" class="print-btn">
    <button onclick="window.print()" style="padding:10px 20px;background:#2D5016;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.2)">
      🖨️ Als PDF speichern
    </button>
  </div>
  <div class="print-wrap">
  <div style="margin-bottom:5px;padding-bottom:4px;border-bottom:1.5px solid #333;display:flex;align-items:center;justify-content:space-between">
    <strong style="font-size:10px;color:#1a1917">FK Nr. 26 &nbsp;|&nbsp; Einsatzplanung KW ${curKW} &nbsp;|&nbsp; ${getDateStr(curKW,0)} – ${getDateStr(curKW,5)}</strong>
  </div>
  <div style="margin-bottom:5px">${legend}</div>
  <table>
    <thead>
      <tr>
        <th style="font-size:7px;padding:2px;background:#E8E8E8;border:0.5px solid #ccc;text-align:center;width:14px">#</th>
        <th style="font-size:7px;padding:2px 4px;background:#E8E8E8;border:0.5px solid #ccc;text-align:left;min-width:52px">Name</th>
        ${headers}
        <th style="font-size:7px;padding:2px;background:#C8C8C8;border:0.5px solid #ccc;border-left:2px solid #888;text-align:center;min-width:22px">Std/Wo</th>
      </tr>
      <tr>
        <th style="background:#EEECEA;border:0.5px solid #ccc;padding:1px"></th>
        <th style="background:#EEECEA;border:0.5px solid #ccc;padding:1px"></th>
        ${subHeaders}
        <th style="background:#EEECEA;border:0.5px solid #ccc;padding:1px"></th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>
  <div style="margin-top:4px;font-size:6px;color:#aaa">Die Zeitangaben sind verbindlich. Änderungen nur nach Absprache.</div>
  </div>
  <script>
    // Automatisch Druckdialog öffnen
    window.addEventListener('load', function(){
      setTimeout(function(){ window.print() }, 500)
    })
  <\/script>
  </body></html>`

  // Neues Fenster öffnen mit dem Plan
  const blob = new Blob([html], {type:'text/html;charset=utf-8'})
  const url = URL.createObjectURL(blob)
  const w = window.open(url, '_blank')
  if(!w){
    // Fallback: download
    const a = document.createElement('a')
    a.href = url
    a.download = 'Einsatzplan_KW'+curKW+'.html'
    document.body.appendChild(a)
    a.click()
    setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a)},1000)
  }
}
// === EXPORT / IMPORT ===
function exportData(){
  const data = {
    version: 1,
    exportDate: new Date().toLocaleDateString('de-DE'),
    maList: maList,
    shifts: shifts,
    ausnahmen: ausnahmen
  }
  const json = JSON.stringify(data, null, 2)
  const blob = new Blob([json], {type:'application/json'})
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = `Schichtplan_Backup_${new Date().toLocaleDateString('de-DE').replace(/\./g,'-')}.json`
  document.body.appendChild(a)
  a.click()
  setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a)},1000)
  
  // Bestätigung
  const hint = document.createElement('div')
  hint.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2D5016;color:white;padding:12px 20px;border-radius:10px;font-size:13px;z-index:9999;text-align:center'
  hint.innerHTML = '💾 Backup gespeichert!'
  document.body.appendChild(hint)
  setTimeout(()=>hint.remove(), 2500)
}

function importData(event){
  const file = event.target.files[0]
  if(!file) return
  const reader = new FileReader()
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result)
      if(!data.version || !data.maList){
        alert('Ungültige Backup-Datei!')
        return
      }
      if(!confirm(`Backup vom ${data.exportDate} importieren? Aktuelle Daten werden überschrieben!`)) return
      maList = data.maList
      shifts = data.shifts || {}
      ausnahmen = data.ausnahmen || {}
      saveState()
      renderAll()
      
      const hint = document.createElement('div')
      hint.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2D5016;color:white;padding:12px 20px;border-radius:10px;font-size:13px;z-index:9999;text-align:center'
      hint.innerHTML = '✓ Backup vom '+data.exportDate+' importiert!'
      document.body.appendChild(hint)
      setTimeout(()=>hint.remove(), 3000)
    } catch(err){
      alert('Fehler beim Importieren: ' + err.message)
    }
  }
  reader.readAsText(file)
  event.target.value = ''
}

// Init
loadState()
renderAll()
</script>
