<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Schichtplan App</title>

<style>
:root {
  --bg:#F8F7F4;--bg2:#FFFFFF;--bg3:#F0EEE9;--text:#1A1917;--text2:#6B6860;--text3:#A8A59E;
  --border:#E2DED6;--border2:#C8C4BA;--accent:#2D5016;--accent-bg:#EAF3DE;
  --danger:#A32D2D;--danger-bg:#FCEBEB;--warn:#633806;--warn-bg:#FAEEDA;
  --info:#0C447C;--info-bg:#E6F1FB;--radius:10px;--radius-sm:6px;
  --col-og:#C0DD97;--col-spaet:#CECBF6;--col-blau:#B5D4F4;--col-gelb:#FAC775;--col-ft:#F5C4B3;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1A1917;--bg2:#252420;--bg3:#2E2C28;--text:#F0EDE6;--text2:#A8A59E;--text3:#6B6860;
  --border:#3A3830;--border2:#4A4840;--accent:#97C459;--accent-bg:#1A2E08;
  --danger:#E24B4A;--danger-bg:#2A0F0F;--warn:#EF9F27;--warn-bg:#2A1A04;--info:#378ADD;--info-bg:#041929;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;height:52px}
.nav-title{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw-ctrl{display:flex;align-items:center;gap:4px}
.kw-ctrl button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kw-ctrl span{font-size:12px;font-weight:600;min-width:48px;text-align:center}
.nav-btns{display:flex;gap:4px}
.nbtn{padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
.nbtn.primary{background:var(--accent);color:white;border-color:transparent}
.nbtn.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.tab.aktiv{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:10px;max-width:1200px;margin:0 auto}
.saved-badge{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--accent-bg);color:var(--accent);display:none}
.saved-badge.show{display:inline-block}

/* Conflict banner */
.conflict-banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.conflict-banner .conflict-list{flex:1;font-size:12px;color:var(--warn)}
.conflict-banner .conflict-list li{margin-bottom:3px}
.conflict-banner .ignore-btn{font-size:11px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--warn);background:var(--bg);color:var(--warn);cursor:pointer;white-space:nowrap;flex-shrink:0}

/* Stats */
.stats{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stats::-webkit-scrollbar{display:none}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;flex-shrink:0;min-width:80px}
.stat-label{font-size:10px;color:var(--text2);margin-bottom:2px}
.stat-val{font-size:18px;font-weight:600}

/* Week table */
.week-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);border:1px solid var(--border)}
.week-table{min-width:660px;border-collapse:collapse;width:100%}
.week-table th{background:var(--bg3);font-size:11px;font-weight:600;text-align:center;padding:6px 4px;border:1px solid var(--border);color:var(--text2);cursor:pointer}
.week-table th:first-child{text-align:left;padding-left:8px;min-width:105px;cursor:default}
.week-table th:hover:not(:first-child){background:var(--accent-bg);color:var(--accent)}
.week-table td{border:1px solid var(--border);padding:2px 3px;vertical-align:top;height:52px;position:relative}
.week-table td:first-child{padding:4px 8px;background:var(--bg2)}
.ma-name-c{font-size:11px;font-weight:600}
.ma-soll-c{font-size:10px;color:var(--text3)}
.mini-tl{position:relative;height:22px;background:var(--bg3);border-radius:4px;overflow:visible;cursor:pointer}
.mini-bar{position:absolute;height:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mini-bar span{font-size:9px;font-weight:600;color:#333;white-space:nowrap;padding:0 3px}
.mini-fz{display:flex;align-items:center;justify-content:center;height:22px;font-size:10px;color:var(--text3)}
.mini-url{display:flex;align-items:center;justify-content:center;height:22px;font-size:10px;font-weight:600;color:#712B13;background:#FAECE7;border-radius:4px}
.mini-bs{display:flex;align-items:center;justify-content:center;height:22px;font-size:10px;font-weight:600;color:#633806;background:#FAEEDA;border-radius:4px}
.mini-ausn{border:2px dashed var(--warn);border-radius:4px}
.diff-pos{color:var(--danger)}.diff-neg{color:var(--info)}.diff-ok{color:var(--accent)}

/* Day editor */
.day-tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{padding:7px 12px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.day-tab.aktiv{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.day-editor{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.ma-edit-row{padding:10px 12px;border-bottom:1px solid var(--border)}
.ma-edit-row:last-child{border-bottom:none}
.ma-edit-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ma-edit-name{font-size:13px;font-weight:600;flex:1}
.ma-std{font-size:12px;font-weight:500;color:var(--text2)}
.ausn-badge{font-size:9px;padding:2px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.status-pills{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.pill{font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);cursor:pointer;font-weight:500;color:var(--text2);background:var(--bg)}
.pill.on-work{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.pill.on-fz{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.pill.on-url{background:#FAECE7;color:#712B13;border-color:#F5C4B3}
.pill.on-bs{background:var(--warn-bg);color:var(--warn);border-color:#FAC775}
.pill.on-ft{background:#F5C4B3;color:#712B13;border-color:#F0997B}
.pill.on-krank{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.pill.on-bzb{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.pill.on-ap{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}

/* Timeline */
.timeline{position:relative;height:34px;background:var(--bg3);border-radius:var(--radius-sm);margin:4px 0;overflow:visible}
.tl-bar{position:absolute;height:100%;border-radius:var(--radius-sm);cursor:grab;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
.tl-bar:active{cursor:grabbing;opacity:.85}
.tl-handle{position:absolute;top:0;width:10px;height:100%;cursor:ew-resize;z-index:3;background:rgba(0,0,0,.12)}
.tl-handle-l{left:0;border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.tl-handle-r{right:0;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.tl-label{font-size:10px;font-weight:700;color:#333;pointer-events:none;white-space:nowrap}
.tl-tick{position:absolute;top:0;width:.5px;height:100%;background:var(--border);pointer-events:none}
.tl-tick-l{position:absolute;bottom:-14px;font-size:8px;color:var(--text3);transform:translateX(-50%);pointer-events:none}
.time-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px}
.time-row input[type=time]{font-size:11px;padding:3px 5px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text)}
.time-row select{font-size:11px;padding:3px 5px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text)}
.time-row input[type=text]{font-size:11px;padding:3px 7px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);flex:1;min-width:100px}
.no-work-cell{height:34px;background:var(--bg3);border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--text3);margin:4px 0}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:500px){.modal-bg{align-items:center;padding:16px}}
.modal{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
@media(min-width:500px){.modal{border-radius:var(--radius)}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px}
.field{margin-bottom:10px}
.field label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.field textarea{min-height:60px;resize:vertical}
.komp-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.komp-chip{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);cursor:pointer;color:var(--text2);background:var(--bg)}
.komp-chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:white;border-color:transparent}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}

/* MA list */
.ma-list{display:flex;flex-direction:column;gap:6px}
.ma-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px}
.ma-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ma-info{flex:1}
.ma-info-name{font-size:13px;font-weight:600}
.ma-info-detail{font-size:10px;color:var(--text2);margin-top:1px}
.komp-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.komp-tag{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--bg3);color:var(--text2)}
.ma-actions{display:flex;gap:5px}
.icon-btn{width:30px;height:22px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Stammdaten */
.stamm-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.stamm-header{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.stamm-grid{display:grid;grid-template-columns:80px 1fr;gap:4px 8px;font-size:12px;align-items:center}
.stamm-label{color:var(--text2)}

/* Stunden */
.std-table{width:100%;border-collapse:collapse}
.std-table th{font-size:11px;font-weight:600;text-align:left;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.std-table td{font-size:12px;padding:7px 8px;border:1px solid var(--border)}
.std-bar-wrap{height:6px;background:var(--bg3);border-radius:999px;overflow:hidden;margin-top:2px}
.std-bar-fill{height:100%;border-radius:999px}

/* Ausnahmen */
.ausn-list{display:flex;flex-direction:column;gap:6px}
.ausn-item{background:var(--bg2);border:1px solid var(--warn);border-radius:var(--radius-sm);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px}
.ausn-item .ausn-del{margin-left:auto;cursor:pointer;color:var(--danger);font-size:16px}

.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:3px}
.farbe-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.section-title{font-size:13px;font-weight:600;margin-bottom:8px;margin-top:14px;color:var(--text)}
</style>
</head>

<div class="nav">
  <span class="nav-title" id="nav-title">Schichtplan</span>

  <div class="tab" id="tab-std" onclick="showView('std')">Stunden</div>

<div class="main">

  <div id="view-std" style="display:none"></div>
</div>

<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

function getDayKey(di){return['mo','di','mi','do','fr','sa'][di]}

function getShift(kw,maId,di){
  const key=`k${maId}`
  if(!shifts[kw])return null
  const arr=shifts[kw][key]
  if(!arr)return null
  return arr[di]
}

function setShift(kw,maId,di,val){
  const key=`k${maId}`
  if(!shifts[kw])shifts[kw]={}
  if(!shifts[kw][key])shifts[kw][key]=Array(6).fill(null)
  shifts[kw][key][di]=val
  saveState()
}

function getEffectiveShift(kw,maId,di){
  var gft=isGesetzlicherFeiertag(kw,di);if(gft)return{t:'ft',_gesperrt:true}
  // Check ausnahme first
  const ausn=getAusnahme(kw,maId,di)
  if(ausn){
    if((ausn.typ==='work'||ausn.typ==='bzb'||ausn.typ==='ap')&&ausn.s&&ausn.e)
      return {t:ausn.typ,s:ausn.s,e:ausn.e,f:ausn.typ==='ap'?'og':'blau',bem:ausn.bem||ausn.notiz||'',_ausnahme:true}
    return {t:ausn.typ||'fz', _ausnahme:true, bem:ausn.notiz||''}
  }
  // Check Stammdaten-Urlaub (vor gespeicherten Schichten!)
  const ma=maList.find(m=>m.id===maId)
  if(ma&&(ma.urlaube||[]).some(function(u){return kw>=u.von&&kw<=(u.bis||u.von)}))
    return{t:'url',_stamm:true}
  const ov=getShift(kw,maId,di)
  if(ov!==null&&ov!==undefined)return ov
  // Fall back to Stammdaten
  if(!ma||!ma.stamm)return{t:'fz'}
  const dk=getDayKey(di)
  const st=ma.stamm[dk]
  if(!st)return{t:'fz'}
  if(st.s&&st.e)return{t:'work',s:st.s,e:st.e,f:st.f||'blau',bem:st.bem||''}
  return{t:st.t||'fz'}
}

function getAusnahme(kw,maId,di){
  if(!ausnahmen[kw])return null
  return ausnahmen[kw].find(a=>a.maId===maId&&a.dayIdx===di)||null
}

// Hours
function calcH(s,e){const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);const b=(eh*60+em-sh*60-sm)/60;return b>6?b-0.5:b}
function fmtH(h){if(h<=0)return'–';const m=Math.round((h%1)*60);return m?`${Math.floor(h)},${String(m).padStart(2,'0')}`:`${Math.floor(h)}`}
function tFrac(t){const[h,m]=t.split(':').map(Number);return(h+m/60-T0)/TR}
function toT(v){const h=Math.floor(v),m=Math.round((v-h)*60);return`${h}:${String(m).padStart(2,'0')}`}
function snapT(v){return Math.round(v*4)/4}

function getWeekArb(kw,maId){
  const ma=maList.find(m=>m.id===maId)
  let total=0
  for(let di=0;di<6;di++){
    const t=getEffectiveShift(kw,maId,di)
    if(t.t==='work'){
      if(ma&&ma.isMack){
        // Mack: 8h normal, aber wenn 2. Balken (Sonderstunden) → 4h Arb
        total+=(t.s2&&t.e2)?4:8
      } else {
        if(t.s&&t.e&&!t.sond) total+=calcH(t.s,t.e)
        if(t.s2&&t.e2&&!t.sond2) total+=calcH(t.s2,t.e2)
      }
    }
  }
  return Math.round(total*100)/100
}
function getMackBZB(kw,maId){
  // Sonderstunden für Mack: 4h pro Tag mit 2. Balken
  let total=0
  for(let di=0;di<6;di++){
    const t=getEffectiveShift(kw,maId,di)
    if(t.t==='work'&&t.s2&&t.e2) total+=4
  }
  return total
}

function getWeekUrlDays(kw,maId){
  let days=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='url')days++}
  return days
}
function getTotalUrlDays(maId){
  let days=0
  Object.keys(shifts).forEach(kw=>{
    days+=getWeekUrlDays(parseInt(kw),maId)
  })
  return days
}

function getWeekUrl(kw,maId,ma){
  let days=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='url')days++}
  return Math.round(days*(ma.soll/5)*100)/100
}
function getWeekFT(kw,maId,ma){
  let days=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='ft')days++}
  return Math.round(days*(ma.soll/6)*100)/100
}
function getWeekBZBAP(kw,maId,ma){
  let total=0
  for(let di=0;di<6;di++){
    const t=getEffectiveShift(kw,maId,di)
    if((t.t==='bzb'||t.t==='ap')&&t.s&&t.e) total+=calcH(t.s,t.e)
    if(t.t==='work'&&t.sond&&t.s&&t.e) total+=calcH(t.s,t.e)
    if(t.t==='work'&&t.sond2&&t.s2&&t.e2) total+=calcH(t.s2,t.e2)
    // Mack: 4h Sonderstunden pro Tag mit 2. Balken
    if(t.t==='work'&&t.s2&&t.e2&&ma&&ma.isMack) total+=4
  }
  return Math.round(total*100)/100
}
function getWeekBS(kw,maId,ma){
  let days=0
  for(let di=0;di<6;di++){const t=getEffectiveShift(kw,maId,di);if(t.t==='bs')days++}
  return Math.round(days*(ma.soll/5)*100)/100
}

// Conflict detection
function detectConflicts(){
  const conflicts=[]
  // Ruhezeit: wenn Spätschicht bis 20:15+, dann nächster Tag frühestens 7:15 (wir machen 7:30)
  maList.forEach(ma=>{
    for(let di=0;di<5;di++){
      const t=getEffectiveShift(curKW,ma.id,di)
      if(t.t==='work'&&t.e){
        const[eh,em]=t.e.split(':').map(Number)
        const endMin=eh*60+em
        const next=getEffectiveShift(curKW,ma.id,di+1)
        if(next.t==='work'&&next.s){
          const[sh,sm]=next.s.split(':').map(Number)
          const startMin=sh*60+sm
          const rest=(24*60-endMin)+startMin
          if(rest<11*60){
            const cid=`ruhe_${ma.id}_${di}`
            if(!ignoredConflicts.has(cid))
              conflicts.push({id:cid,text:`${ma.name}: Ruhezeit ${DAYS[di]} ${t.e}→${DAYS[di+1]} ${next.s} (${Math.round(rest/60*10)/10}h < 11h)`})
          }
        }
      }
    }
  })
  // Schwanger - max 20:00 und max 8,5h
  maList.forEach(ma=>{
    if(!ma.schwanger)return
    for(let di=0;di<6;di++){
      const t=getEffectiveShift(curKW,ma.id,di)
      if(t.t==='work'&&t.s&&t.e){
        const[eh,em]=t.e.split(':').map(Number)
        const endMin=eh*60+em
        // Ende nach 20:00
        if(endMin>20*60){
          const cid=`schw_end_${ma.id}_${di}`
          if(!ignoredConflicts.has(cid))
            conflicts.push({id:cid,text:`${ma.name} 🤰: Ende ${t.e} nach 20:00 am ${DAYS[di]}`})
        }
        // Mehr als 8,5h
        const h=calcH(t.s,t.e)
        if(h>8.5){
          const cid=`schw_std_${ma.id}_${di}`
          if(!ignoredConflicts.has(cid))
            conflicts.push({id:cid,text:`${ma.name} 🤰: ${fmtH(h)}h am ${DAYS[di]} – max. 8,5h erlaubt`})
        }
      }
    }
  })
  // Abweichung von Stammdaten prüfen
  maList.forEach(ma=>{
    if(!ma.stamm) return
    const dkeys=['mo','di','mi','do','fr','sa']
    for(let di=0;di<6;di++){
      const dk=dkeys[di]
      const stamm=ma.stamm[dk]
      if(!stamm) continue // no stamm for this day
      if(!stamm.s&&!stamm.e&&stamm.t==='fz'||stamm.t==='bs'){} // FZ/BS - still check plan
      const ov=getShift(curKW,ma.id,di)
      if(!ov) continue // using stamm = no conflict
      // Check if override differs from stamm
      const stammIsWork=!!(stamm&&stamm.s&&stamm.e)
      const ovIsWork=!!(ov.t==='work'&&ov.s&&ov.e)
      // Stamm says work but override differs
      if(stammIsWork&&ovIsWork&&(ov.s!==stamm.s||ov.e!==stamm.e)){
        const cid=`stamm_${ma.id}_${di}_${curKW}`
        if(!ignoredConflicts.has(cid))
          conflicts.push({id:cid,text:`${ma.name} ${DAYS[di]}: Abweichung von Spezialzeit (${stamm.s}–${stamm.e} → ${ov.s}–${ov.e})`})
      }
      // Stamm says FZ/BS but plan says work
      if(stamm&&!stammIsWork&&(stamm.t==='fz'||stamm.t==='bs')&&ovIsWork){
        const cid=`stamm_fz_${ma.id}_${di}_${curKW}`
        if(!ignoredConflicts.has(cid))
          conflicts.push({id:cid,text:`${ma.name} ${DAYS[di]}: Spezialzeit ist ${stamm.t==='fz'?'FZ':'Berufsschule'} – trotzdem als Arbeit eingeplant`})
      }
    }
  })

  // Geplanter Urlaub diese KW nicht eingetragen
  maList.forEach(ma=>{
    if(!ma.urlaube||!ma.urlaube.length)return
    ma.urlaube.forEach(u=>{
      if(curKW>=u.von&&curKW<=(u.bis||u.von)){
        const hasWork=Array.from({length:6},(_,di)=>getEffectiveShift(curKW,ma.id,di)).some(t=>t.t==='work')
        if(hasWork){
          const cid=`urlplan_${ma.id}_${curKW}`
          if(!ignoredConflicts.has(cid))
            conflicts.push({id:cid,text:`${ma.name}: Geplanter Urlaub KW ${u.von}${u.bis&&u.bis!==u.von?`–${u.bis}`:''}${u.notiz?` (${u.notiz})`:''} – aber noch Schichten eingetragen!`})
        }
      }
    })
  })
  return conflicts
}

function renderConflicts(){
  const cf=detectConflicts()
  // Ignorierte die nicht mehr aktiv sind → aus Liste entfernen
  const activeIds=new Set(cf.map(c=>c.id))
  ;[...ignoredConflicts].forEach(id=>{if(!activeIds.has(id))ignoredConflicts.delete(id)})
  const el=document.getElementById('conflict-area')
  const visible=cf.filter(c=>!ignoredConflicts.has(c.id))
  if(!visible.length){el.innerHTML='';return}
  el.innerHTML=`<div class="conflict-banner">
    <div class="conflict-list"><b>⚠️ Hinweise:</b><ul style="margin-top:4px;padding-left:16px">${visible.map(c=>`<li>${c.text}</li>`).join('')}</ul></div>
    <button class="ignore-btn" onclick="ignoreAll([${visible.map(c=>`'${c.id}'`).join(',')}])">Ignorieren</button>
  </div>`
}
function ignoreAll(ids){
  ids.forEach(id=>ignoredConflicts.add(id))
  localStorage.setItem('sp_ignored',JSON.stringify([...ignoredConflicts]))
  renderConflicts()
}

  '25.12.':'1. Weihnachtstag',
  '26.12.':'2. Weihnachtstag',
}

function getDateObj(kw,di){
  // KW1 Monday: find monday of week containing Jan 4
  const jan4=new Date(2026,0,4)
  const dow=(jan4.getDay()+6)%7 // Mon=0..Sun=6
  const kw1Monday=new Date(jan4)
  kw1Monday.setDate(jan4.getDate()-dow)
  const d=new Date(kw1Monday)
  d.setDate(kw1Monday.getDate()+(kw-1)*7+di)
  return d
}

function getDateStr(kw,di){
  const d=getDateObj(kw,di)
  return`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.`
}

function isGesetzlicherFeiertag(kw,di){var g={'01.01.':'Neujahr','06.01.':'Hl. Drei Koenige','03.04.':'Karfreitag','05.04.':'Ostersonntag','06.04.':'Ostermontag','01.05.':'Tag der Arbeit','14.05.':'Christi Himmelfahrt','24.05.':'Pfingstsonntag','25.05.':'Pfingstmontag','04.06.':'Fronleichnam','15.08.':'Mariae Himmelfahrt','03.10.':'Tag d. Dt. Einheit','01.11.':'Allerheiligen','25.12.':'1. Weihnachtstag','26.12.':'2. Weihnachtstag'};return g[getDateStr(kw,di)]||null}
function isFeiertag(kw,di){
  const dateStr=getDateStr(kw,di)
  return FEIERTAGE_2026[dateStr]||null
}

      const cellLocked=isGesetzlicherFeiertag(curKW,di)||cellDone
      const lockStyle=cellDone?'opacity:0.6;pointer-events:none;':''

function addSecondShift(maId,di){
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const cur=getEffectiveShift(curKW,ma.id,di)
  const upd={...cur,s2:'16:00',e2:'20:00',f2:cur.f||'blau',bem2:''}
  setShift(curKW,ma.id,di,upd)
  renderTag()
}
function removeSecondShift(maId,di){
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const cur=getEffectiveShift(curKW,ma.id,di)
  const upd={...cur}
  delete upd.s2;delete upd.e2;delete upd.f2;delete upd.bem2
  setShift(curKW,ma.id,di,upd)
  renderTag()
}
function saveDayNote(key,val){
  dayNotes[key]=val

}

function toggleMAInaktiv(id){
  var ma=maList.find(function(m){return m.id==id})

  ma.inaktiv=!ma.inaktiv

function toggleDayDone(di){
  const key=`done_${curKW}_${di}`
  const cur=localStorage.getItem(key)==='1'

function setStatus(maId,di,status){
  const ma=maList.find(m=>m.id==maId)
  if(!ma)return
  const cur=getEffectiveShift(curKW,ma.id,di)
  let val
  if(status==='work'||status==='bzb'||status==='ap'){val={t:status,s:cur.s||'8:00',e:cur.e||'16:00',f:status==='bzb'?'blau':status==='ap'?'og':'blau',bem:cur.bem||''}}
  else val={t:status}
  setShift(curKW,ma.id,di,val)
  renderTag();renderStats();renderConflicts()
}


function toggleSonderstunden(maId,di,field){
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const cur=getEffectiveShift(curKW,ma.id,di)
  const key=field==='f2'?'sond2':'sond'
  setShift(curKW,ma.id,di,{...cur,[key]:!cur[key]})
  renderTag();renderWoche();renderStats()

function getCXY(e){return e.touches?{x:e.touches[0].clientX}:{x:e.clientX}}
function startDrag(e,maId,mode){
  e.preventDefault()
  const tl=document.getElementById('tl_'+maId);if(!tl)return
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const t=getEffectiveShift(curKW,ma.id,curDay)
  const is2=mode.includes('2')
  dragState={maId,mode,rect:tl.getBoundingClientRect(),startX:getCXY(e).x,startS:is2?(t.s2||t.s):t.s,startE:is2?(t.e2||t.e):t.e}
  document.addEventListener('mousemove',onDrag);document.addEventListener('mouseup',stopDrag)
}
function startDragTouch(e,maId,mode){
  const tl=document.getElementById('tl_'+maId);if(!tl)return
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const t=getEffectiveShift(curKW,ma.id,curDay)
  const is2=mode.includes('2')
  dragState={maId,mode,rect:tl.getBoundingClientRect(),startX:getCXY(e).x,startS:is2?(t.s2||t.s):t.s,startE:is2?(t.e2||t.e):t.e}
  document.addEventListener('touchmove',onDrag,{passive:false});document.addEventListener('touchend',stopDrag)
}
function onDrag(e){
  if(!dragState)return;if(e.cancelable)e.preventDefault()
  const{maId,mode,rect,startX,startS,startE}=dragState
  const dx=(getCXY(e).x-startX)/rect.width
  const ma=maList.find(m=>m.id==maId);if(!ma)return
  const t=getEffectiveShift(curKW,ma.id,curDay)
  const is2=mode.includes('2')
  const modeBase=mode.replace('2','')
  const[sh,sm]=startS.split(':').map(Number),[eh,em]=startE.split(':').map(Number)
  const dur=(eh*60+em-sh*60-sm)/60
  let ns,ne
  if(modeBase==='move'){
    ns=snapT((sh+sm/60-T0)+dx*TR);ns=Math.max(0,Math.min(TR-dur,ns));ne=ns+dur
    if(is2){t.s2=toT(T0+ns);t.e2=toT(T0+ne)}else{t.s=toT(T0+ns);t.e=toT(T0+ne)}
  } else if(modeBase==='left'){
    ns=snapT((sh+sm/60-T0)+dx*TR);ns=Math.max(0,Math.min((eh+em/60-T0)-.25,ns))
    if(is2)t.s2=toT(T0+ns);else t.s=toT(T0+ns)
  } else {
    ne=snapT((eh+em/60-T0)+dx*TR);ne=Math.max((sh+sm/60-T0)+.25,Math.min(TR,ne))
    if(is2)t.e2=toT(T0+ne);else t.e=toT(T0+ne)
  }
  // Update bar 1
  if(!is2){
    const bar=document.getElementById('bar_'+maId)
    if(bar){bar.style.left=tFrac(t.s)*100+'%';bar.style.width=(tFrac(t.e)-tFrac(t.s))*100+'%';const lbl=document.getElementById('lbl_'+maId);if(lbl)lbl.textContent=t.s+'–'+t.e}
  }
  // Update bar 2
  if(is2){
    const bar2=document.getElementById('bar2_'+maId)
    if(bar2&&t.s2&&t.e2){
      bar2.style.left=tFrac(t.s2)*100+'%'
      bar2.style.width=(tFrac(t.e2)-tFrac(t.s2))*100+'%'
      const lbl2=bar2.querySelector('.tl-label')
      if(lbl2)lbl2.textContent=t.s2+'–'+t.e2
    }
  }
  const std=document.getElementById('std_'+maId)
  const h1=calcH(t.s,t.e), h2=t.s2&&t.e2?calcH(t.s2,t.e2):0
  if(std)std.textContent=fmtH(h1+h2)+' Std.'
}
function stopDrag(){
  if(!dragState)return
  const{maId,mode}=dragState
  const ma=maList.find(m=>m.id==maId)
  if(ma){const t=getEffectiveShift(curKW,ma.id,curDay);setShift(curKW,ma.id,curDay,{...t})}
  dragState=null
  document.removeEventListener('mousemove',onDrag);document.removeEventListener('mouseup',stopDrag)
  document.removeEventListener('touchmove',onDrag);document.removeEventListener('touchend',stopDrag)
  renderConflicts()
}

  const typ=document.getElementById('f-stamm-typ').value
  const isWork=typ==='work'
  ;['f-stamm-von','f-stamm-bis','f-stamm-bem'].forEach(id=>{
    const el=document.getElementById(id)
    if(el){el.style.opacity=isWork?'1':'0.4';el.disabled=!isWork}
  })
}
function addStamm(){
  const dk=document.getElementById('f-stamm-tag').value
  const typ=document.getElementById('f-stamm-typ').value
  const von=document.getElementById('f-stamm-von').value.trim()
  const bis=document.getElementById('f-stamm-bis').value.trim()
  const bem=document.getElementById('f-stamm-bem').value.trim()
  if(typ==='work'&&(!von||!bis)){alert('Bitte Von und Bis eingeben!');return}
  if(!tempStamm[dk])tempStamm[dk]={}
  if(typ==='work') tempStamm[dk]={s:von,e:bis,bem,t:'work'}
  else tempStamm[dk]={t:typ}
  // Refresh list
  const list=document.getElementById('stamm-list')
  if(list){
    const dayName={mo:'Mo',di:'Di',mi:'Mi',do:'Do',fr:'Fr',sa:'Sa'}
    const dn={mo:'Mo',di:'Di',mi:'Mi',do:'Do',fr:'Fr',sa:'Sa'}
    list.innerHTML=Object.entries(tempStamm).filter(([k,v])=>v&&(v.s&&v.e||v.t==='fz'||v.t==='bs')).map(([dk,st])=>{
      const isFZ=st.t==='fz',isBS=st.t==='bs'
      const chipBg=isFZ?'var(--bg3)':isBS?'var(--warn-bg)':'var(--accent-bg)'
      const chipCol=isFZ?'var(--text2)':isBS?'var(--warn)':'var(--accent)'
      const label=isFZ?'FZ':isBS?'Berufsschule':(st.s+' – '+st.e)
      return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:3px">'+
        '<span style="background:var(--accent-bg);color:var(--accent);padding:3px 8px;border-radius:999px;font-weight:600;min-width:32px;text-align:center">'+(dn[dk]||dk)+'</span>'+
        '<span style="background:'+chipBg+';color:'+chipCol+';padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500">'+label+'</span>'+
        (!isFZ&&!isBS&&st.bem?'<span style="color:var(--text3);font-size:11px">'+st.bem+'</span>':'')+

function autoWorkStamm(dk){
  // Auto switch to Arbeit when time is entered
  const sel=document.getElementById('st_t_'+dk)
  if(sel&&sel.value!=='work'){
    sel.value='work'
    toggleStammRow(dk)
  }
}
function toggleStammRow(dk){
  const sel=document.getElementById('st_t_'+dk)
  const isWork=sel.value==='work'
  ;['s','e','bem'].forEach(f=>{
    const el=document.getElementById('st_'+f+'_'+dk)
    if(el){
      el.style.opacity=isWork?'1':'0.3'
      if(!isWork)el.value=''
      if(isWork&&f==='s'&&!el.value)el.value='8:00'
      if(isWork&&f==='e'&&!el.value)el.value='16:00'
    }
  })
}
function addUrlaub(){
  const von=parseInt(document.getElementById('f-url-von').value)
  const bis=parseInt(document.getElementById('f-url-bis').value)||von
  const notiz=document.getElementById('f-url-notiz').value
  if(!von)return
  tempUrlaube.push({von,bis,notiz})
  // refresh urlaub list
  const ul=document.getElementById('urlaub-list')
  if(ul)ul.innerHTML=tempUrlaube.map((u,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px">
    <span style="background:var(--warn-bg);color:var(--warn);padding:3px 8px;border-radius:999px">KW ${u.von}${u.bis&&u.bis!==u.von?` – KW ${u.bis}`:''}</span>

}
function removeUrlaub(idx){

function saveMA(id){
  const name=document.getElementById('f-name').value.trim()
  const soll=parseInt(document.getElementById('f-soll').value)||0
  const resturlaub=parseInt(document.getElementById('f-resturlaub').value)||0
  const komps=[...document.querySelectorAll('#komp-grid .komp-chip.on')].map(e=>e.dataset.k)
  const schwanger=document.getElementById('f-schw').checked
  const inaktiv=document.getElementById('f-inaktiv')?document.getElementById('f-inaktiv').checked:false
  const hinweise=document.getElementById('f-hinweise').value.trim()
  const urlaube=[...tempUrlaube]
  const stamm={...tempStamm}
  const numId=parseInt(id)

  if(!name)return alert('Bitte Namen eingeben')
  if(numId&&!isNaN(numId)){
    const ma=maList.find(m=>m.id===numId)
    if(!ma)return alert('Mitarbeiter nicht gefunden!')
    Object.assign(ma,{name,soll,resturlaub,komps,schwanger,inaktiv,hinweise,urlaube,stamm})
  } else {
    const newId=Math.max(0,...maList.map(m=>m.id))+1
    const newMa={id:newId,name,soll,komps,schwanger,hinweise,urlaube,stamm,farbe:AVCOLS[maList.length%AVCOLS.length],stamm:{mo:{t:'fz'},di:{t:'fz'},mi:{t:'fz'},do:{t:'fz'},fr:{t:'fz'},sa:{t:'fz'}}}
    maList.push(newMa)
    Object.keys(shifts).forEach(kw=>{if(!shifts[kw][`k${newId}`])shifts[kw][`k${newId}`]=Array(6).fill(null)})
  }
  saveState();closeModal();renderAll()
}
function deleteMA(id){
  if(!confirm('Mitarbeiter wirklich löschen?'))return
  maList=maList.filter(m=>m.id!==id)
  Object.keys(shifts).forEach(kw=>{delete shifts[kw][`k${id}`]})
  saveState();closeModal();renderAll()
}

// === STUNDEN ===

function getVerplantDays(ma){
  // Nur ZUKÜNFTIGE Urlaubstage - strikt ab curKW+1
  var nextKW=curKW+1
  var days=0
  var shiftUrlKWs={}
  Object.keys(shifts).forEach(function(kw){
    if(parseInt(kw)<=curKW) return  // nur ab nächster KW
    var urlDays=0
    for(var di=0;di<6;di++){
      const t=getEffectiveShift(parseInt(kw),ma.id,di)
      if(t.t==='url') urlDays++
    }
    if(urlDays>0) shiftUrlKWs[parseInt(kw)]=urlDays
  })
  ;(ma.urlaube||[]).forEach(function(u){
    const vonKW=u.von, bisKW=u.bis||u.von
    if(bisKW<=curKW) return  // vergangene KWs ignorieren
    const effVon=Math.max(vonKW,nextKW)
    for(var kw=effVon;kw<=bisKW;kw++){
      if(!shiftUrlKWs[kw]) days+=5
    }
  })
  Object.values(shiftUrlKWs).forEach(function(d){days+=d})
  return days
}

function getResturlaub(ma){
  if(ma.resturlaub==null)return null
  // Nur wirklich genommene Urlaubstage abziehen (alle KWs)
  const taken=getTotalUrlDays(ma.id)
  return Math.max(0, ma.resturlaub - taken)
}

function renderStd(){
  const el=document.getElementById('view-std')
  const rows=maList.map(ma=>{
    const arb=getWeekArb(curKW,ma.id)
    const url=getWeekUrl(curKW,ma.id,ma)
    const ft=getWeekFT(curKW,ma.id,ma)
    const bs=getWeekBS(curKW,ma.id,ma)
    const bzbap=getWeekBZBAP(curKW,ma.id,ma)
    const total=arb+url+ft+bs+bzbap
    const diff=Math.round((total-ma.soll)*100)/100
    return{ma,arb,url,ft,bs,bzbap,total,diff}
  })

  let html=`<table class="std-table"><thead><tr><th>Name</th><th>Arb.</th><th>URL-Ges.</th><th>URL (KW)</th><th>Rest-URL</th><th>Verplant</th><th>FT</th><th>BS</th><th>Sonderstd.</th><th>Soll</th><th>Ist</th><th>Diff</th><th style="min-width:70px">Auslastung</th></tr></thead><tbody>`
  rows.forEach(({ma,arb,url,ft,bs,bzbap,total,diff})=>{
    const pct=Math.min(100,Math.round(total/ma.soll*100))||0
    const barCol=diff>2?'#E24B4A':diff<-2?'#378ADD':'#97C459'
    const diffCls=diff>1?'diff-pos':diff<-1?'diff-neg':'diff-ok'
    const rest=getResturlaub(ma)
    const restCol=rest!=null&&rest<5?'color:#E24B4A;font-weight:600':''
    const urlDaysKW=getWeekUrlDays(curKW,ma.id)
    const urlDaysGes=getTotalUrlDays(ma.id)
    html+=`<tr>
      <td style="font-weight:600;cursor:pointer" onclick="showEditMA(${ma.id})">${ma.name}${ma.schwanger?' 🤰':''}</td>
      <td>${fmtH(arb)}</td>
      <td>${ma.resturlaub!=null?ma.resturlaub+'T':'–'}</td>
      <td>${urlDaysKW>0?urlDaysKW+'T':'–'}</td>
      <td style="${restCol}">${rest!=null?rest+'T':'–'}</td>
      <td style="color:var(--text2)">${getVerplantDays(ma)>0?getVerplantDays(ma)+'T':'–'}</td>
      <td>${ft>0?fmtH(ft):'–'}</td>
      <td>${bs>0?fmtH(bs):'–'}</td>
      <td>${bzbap>0?fmtH(bzbap):'–'}</td>
      <td>${ma.soll}</td>
      <td style="font-weight:600">${fmtH(total)}</td>
      <td class="${diffCls}" style="font-weight:600">${diff>=0?'+':''}${diff}</td>
      <td><div class="std-bar-wrap"><div class="std-bar-fill" style="width:${pct}%;background:${barCol}"></div></div><span style="font-size:10px;color:var(--text3)">${pct}%</span></td>
    </tr>`
  })

  // Totals row
  const totArb=Math.round(rows.reduce((s,r)=>s+r.arb,0)*100)/100
  const totUrl=Math.round(rows.reduce((s,r)=>s+r.url,0)*100)/100
  const totFT=Math.round(rows.reduce((s,r)=>s+r.ft,0)*100)/100
  const totBS=Math.round(rows.reduce((s,r)=>s+r.bs,0)*100)/100
  const totBzb=Math.round(rows.reduce((s,r)=>s+r.bzbap,0)*100)/100
  const totSoll=rows.reduce((s,r)=>s+r.ma.soll,0)
  const totIst=Math.round(rows.reduce((s,r)=>s+r.total,0)*100)/100
  const totDiff=Math.round((totIst-totSoll)*100)/100
  html+=`<tr style="font-weight:700;border-top:2px solid var(--border);background:var(--bg2)">
    <td>GESAMT</td>
    <td>${fmtH(totArb)}</td>
    <td>–</td>
    <td>${totUrl>0?fmtH(totUrl):'–'}</td>
    <td>–</td>
    <td>–</td>
    <td>${totFT>0?fmtH(totFT):'–'}</td>
    <td>${totBS>0?fmtH(totBS):'–'}</td>
    <td>${totBzb>0?fmtH(totBzb):'–'}</td>
    <td>${totSoll}</td>
    <td>${fmtH(totIst)}</td>
    <td class="${totDiff>=0?'diff-pos':'diff-neg'}">${totDiff>=0?'+':''}${totDiff}</td>
    <td></td>
  </tr>`

  html+=`</tbody></table>`
  el.innerHTML=html
}

// === SEND TO CLAUDE FOR PDF ===
function exportForClaude(){
  // Export current week data as JSON for Claude
  const weekData = {
    kw: curKW,
    dateFrom: getDateStr(curKW,0),
    dateTo: getDateStr(curKW,5),
    dayNotes: Array.from({length:6},function(_,di){return dayNotes[curKW+'_'+di]||''}),
    mitarbeiter: maList.map(ma => {
      const tage = Array.from({length:6},(_,di) => {
        const t = getEffectiveShift(curKW, ma.id, di)
        const ft = isFeiertag(curKW, di)
        return {
          tag: DAYS[di],
          datum: getDateStr(curKW,di),
          feiertag: ft||null,
          ...t
        }
      })
      return {
        id: ma.id,
        name: ma.name,
        soll: ma.soll,
        isMack: ma.isMack||false,
        schwanger: ma.schwanger||false,
        tage: tage,
        wochenstunden: ma.isMack?8:getWeekArb(curKW,ma.id)
      }
    })
  }

  const json = JSON.stringify(weekData, null, 2)
  const blob = new Blob([json], {type:'application/json'})
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = `KW${curKW}_fuer_Claude.json`
  document.body.appendChild(a)
  a.click()
  setTimeout(()=>{URL.revokeObjectURL(url);if(document.body.contains(a))document.body.removeChild(a)},1000)

  // Show instructions
  const modal = document.createElement('div')
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px'
  modal.innerHTML = `<div style="background:white;border-radius:12px;padding:20px;max-width:360px;text-align:center">
    <div style="font-size:32px;margin-bottom:8px">📋</div>
    <div style="font-size:15px;font-weight:600;margin-bottom:8px">Datei wurde heruntergeladen!</div>
    <div style="font-size:13px;color:#555;margin-bottom:16px;line-height:1.5">
      1. Geh zu Claude.ai<br>
      2. Lade die Datei <strong>KW${curKW}_fuer_Claude.json</strong> hoch<br>
      3. Schreib: <em>"Bitte PDF für KW ${curKW} generieren"</em>
    </div>
    <button onclick="this.closest('div').parentElement.remove()" style="padding:10px 24px;background:#2D5016;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer">OK</button>
  </div>`
  document.body.appendChild(modal)
}

function exportPDF(){
  const T0=6,T1=22,TR=T1-T0
  const COLS_PDF={og:'#C0DD97',blau:'#B5D4F4',spaet:'#CECBF6',gelb:'#FAC775',ft:'#F5C4B3'}

  const rows = maList.map((ma,mi) => {
    const cells = Array.from({length:6},(_,di) => {
      const t = getEffectiveShift(curKW, ma.id, di)
      const ftDay = isFeiertag(curKW, di)
      const cellBg = ftDay ? '#FFF3E0' : (mi%2===0?'#FAFAF8':'white')

      if(t.t==='work'&&t.s&&t.e){
        const l = tFrac(t.s)*100
        const w = (tFrac(t.e)-tFrac(t.s))*100
        const bg = COLS_PDF[t.f]||'#B5D4F4'
        const nh = calcH(t.s,t.e)
        const dispH = fmtH(nh)

        const ticks = Array.from({length:9},(_,i)=>{
          const hh=T0+i*2, p=(hh-T0)/TR*100
          return `<div style="position:absolute;left:${p}%;top:0;width:0.5px;height:100%;background:rgba(0,0,0,0.15)"></div>
                  <div style="position:absolute;left:${p}%;bottom:-8px;font-size:4.5px;color:#bbb;transform:translateX(-50%)">${hh}</div>`
        }).join('')

        const words=(t.bem||'').split(' + ')

            <div style="white-space:nowrap;overflow:hidden">${words.slice(0,mid).join(' + ')}</div>

function importData(event){
  const file = event.target.files[0]
  if(!file) return
  const reader = new FileReader()
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result)
      if(!data.version || !data.maList){ alert('Ungültige Backup-Datei!'); return }
      if(!confirm('Backup vom '+data.exportDate+' importieren? Aktuelle Daten werden überschrieben!')) return
      maList = data.maList
      shifts = data.shifts || {}
      ausnahmen = data.ausnahmen || {}
      dayNotes = data.dayNotes || {}
      if(data.settings&&window.settings) Object.assign(window.settings, data.settings)
      if(data.ignoredConflicts) ignoredConflicts = new Set(data.ignoredConflicts)
      saveState()
      renderAll()
      const hint = document.createElement('div')
      hint.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2D5016;color:white;padding:12px 20px;border-radius:10px;font-size:13px;z-index:9999'
      hint.textContent = '\u2713 Importiert!'
      document.body.appendChild(hint)
      setTimeout(function(){hint.remove()}, 3000)
    } catch(err){ alert('Fehler: ' + err.message) }
  }
  reader.readAsText(file)
  event.target.value = ''
}

function wuerfelWoche(){
  if(!confirm('KW '+curKW+' befuellen?'))return
  var frH=[{s:'6:00',e:'15:00',f:'og',bem:'O&G'},{s:'6:30',e:'15:00',f:'og',bem:'O&G'},{s:'7:30',e:'15:00',f:'blau',bem:'Laden'},{s:'8:00',e:'16:00',f:'blau',bem:'Laden'}]
  var spH=[{s:'11:00',e:'20:15',f:'spaet',bem:'Laden + Kasse'},{s:'13:00',e:'20:15',f:'spaet',bem:'Laden'},{s:'13:00',e:'19:00',f:'spaet',bem:'Kasse'}]
  function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}
  function toMin(t){var p=t.split(':').map(Number);return p[0]*60+p[1]}
  function rOk(a,b){if(!a||!b)return true;return(1440-toMin(a))+toMin(b)>=660}

  // Anzahl Feiertage diese KW → reduziert effektives Soll
  var ftAnzahl=0
  for(var i=0;i<6;i++){if(isGesetzlicherFeiertag(curKW,i))ftAnzahl++}
  // Pro Feiertag: Soll um eine Tagesquote reduzieren
  function effSoll(ma){return Math.max(0,ma.soll-ftAnzahl*(ma.soll/5))}

  var res={}
  maList.forEach(function(ma){
    if(ma.inaktiv){res[ma.id]={tage:Array(6).fill({t:'neutral'}),geplant:0};return}
    var tage=Array(6).fill(null),geplant=0
    var hatUrl=(ma.urlaube||[]).some(function(u){return curKW>=u.von&&curKW<=(u.bis||u.von)})
    for(var i=0;i<6;i++){
      if(isGesetzlicherFeiertag(curKW,i)){tage[i]={t:'fz'};continue}
      var ausn=getAusnahme(curKW,ma.id,i)
      if(ausn){tage[i]=null;if(ausn.typ==='work'&&ausn.s&&ausn.e)geplant+=calcH(ausn.s,ausn.e);continue}
      var dk=['mo','di','mi','do','fr','sa'][i],st=ma.stamm&&ma.stamm[dk]
      if(st&&st.s&&st.e){if(hatUrl){tage[i]={t:'url'};geplant+=ma.soll/5}else{tage[i]={t:'work',s:st.s,e:st.e,f:st.f||'blau',bem:st.bem||''};geplant+=calcH(st.s,st.e)};continue}
      if(hatUrl){tage[i]={t:'url'};geplant+=ma.soll/5;continue}
      tage[i]='frei'
    }
    res[ma.id]={tage:tage,geplant:geplant}
  })
  for(var i=0;i<6;i++){
    if(isGesetzlicherFeiertag(curKW,i))continue
    var dk=['mo','di','mi','do','fr','sa'][i]
    var mb2=(window.settings&&window.settings.minBesetzung&&window.settings.minBesetzung[dk])||{}
    var mF=mb2.frueh||3,mS=mb2.spaet||1,fC=0,sC=0
    maList.forEach(function(ma){var t=res[ma.id].tage[i];if(t&&t.t==='work'&&t.s){if(toMin(t.s)<=540)fC++;else sC++}})
    var frei=maList.filter(function(ma){return res[ma.id].tage[i]==='frei'})
    for(var j=frei.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=frei[j];frei[j]=frei[k];frei[k]=tmp}
    frei.forEach(function(ma){
      var r=res[ma.id]
      if(r.geplant>=effSoll(ma)-0.5){r.tage[i]={t:'fz'};return}
      var pe=i>0&&r.tage[i-1]&&r.tage[i-1].t==='work'?r.tage[i-1].e:null
      var fOk=frH.filter(function(x){return rOk(pe,x.s)}),sOk=spH.filter(function(x){return rOk(pe,x.s)})
      var tpl
      if(fC<mF){tpl=rnd(fOk.length?fOk:frH);fC++}
      else if(sC<mS){tpl=rnd(sOk.length?sOk:spH);sC++}
      else tpl=Math.random()<0.6?rnd(fOk.length?fOk:frH):rnd(sOk.length?sOk:spH)
      r.tage[i]={t:'work',s:tpl.s,e:tpl.e,f:tpl.f,bem:tpl.bem};r.geplant+=calcH(tpl.s,tpl.e)
    })
  }
  maList.forEach(function(ma){res[ma.id].tage.forEach(function(v,i){if(v==='frei')res[ma.id].tage[i]={t:'fz'}})})
  if(!shifts[curKW])shifts[curKW]={}
  maList.forEach(function(ma){shifts[curKW]['k'+ma.id]=res[ma.id].tage})
  saveState();renderAll()
  var h=document.createElement('div')
  h.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2D5016;color:white;padding:12px 22px;border-radius:10px;font-size:13px;z-index:9999'
  h.textContent='Woche befuellt!'
  document.body.appendChild(h);setTimeout(function(){h.remove()},2500)
}

function printDirect(){
  function tf(t){try{var p=t.split(':').map(Number);return(p[0]+p[1]/60-6)/16}catch(e2){return 0}}
  function cH2(s,e){try{var sp=s.split(':').map(Number),ep=e.split(':').map(Number),b=(ep[0]*60+ep[1]-sp[0]*60-sp[1])/60;return b>6?b-0.5:b}catch(e2){return 0}}
  function fH2(h){if(h<=0)return'';var m=Math.round((h%1)*60);return m?Math.floor(h)+','+String(m).padStart(2,'0'):''+Math.floor(h)}
  var dates=DAYS.map(function(_,di){return getDateStr(curKW,di)})
  var mid=Math.ceil(maList.length/2)
  function tbl(mas,pn){
    var h='<div style="margin-bottom:5px"><b style="font-size:11px">FK Nr. 26 | KW '+curKW+' | '+dates[0]+' bis '+dates[5]+'</b> Seite '+pn+'/2</div>'
    h+='<table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:7px"><colgroup><col style="width:16px"><col style="width:50px">'
    for(var i2=0;i2<6;i2++)h+='<col style="width:auto"><col style="width:18px">'
    h+='<col style="width:20px"></colgroup><thead><tr style="background:#f0ede9"><th style="padding:2px;border:0.3px solid #ccc">#</th><th style="padding:2px;border:0.3px solid #ccc;text-align:left">Name</th>'
    DAYS.forEach(function(d,i2){h+='<th colspan="2" style="padding:2px;border:0.3px solid #ccc;text-align:center"><b>'+d+'</b><br>'+dates[i2]+'</th>'})
    h+='<th style="padding:2px;border:0.3px solid #ccc">Std</th></tr></thead><tbody>'
    mas.forEach(function(ma,idx2){
      h+='<tr style="background:'+(idx2%2===0?'#fff':'#f8f7f4')+'">'
      h+='<td style="padding:2px;border:0.3px solid #ccc;text-align:center">'+(maList.indexOf(ma)+1)+'</td>'
      h+='<td style="padding:2px;border:0.3px solid #ccc;font-weight:700">'+ma.name+'</td>'
      var wh=0
      DAYS.forEach(function(_,di2){
        var t=getEffectiveShift(curKW,ma.id,di2),hh=0
        if(t.t==='work'&&t.s&&t.e){hh=ma.isMack?(t.f2==='bzb'&&t.s2&&t.e2?4:8):cH2(t.s,t.e)+(t.s2&&t.e2?cH2(t.s2,t.e2):0)}
        wh+=hh
        var cell='<div style="position:relative;height:13px;background:#f0ede9;border-radius:2px">'
        if(t.t==='work'&&t.s&&t.e){
          var l=tf(t.s)*100,w=(tf(t.e)-tf(t.s))*100
          var bg2=FARBEN[t.f]?FARBEN[t.f].bg:'#B5D4F4'
          cell+='<div style="position:absolute;left:'+l+'%;width:'+w+'%;height:100%;background:'+bg2+';border-radius:2px;display:flex;align-items:center;justify-content:center"><span style="font-size:5.5px;font-weight:700;color:#333;white-space:nowrap">'+t.s+'–'+t.e+'</span></div>'
        }
        else if(t.t==='url')cell+='<div style="position:absolute;inset:0;background:#FAECE7;display:flex;align-items:center;justify-content:center;font-size:5px;color:#712B13;font-weight:700">URL</div>'
        else if(t.t==='ft')cell+='<div style="position:absolute;inset:0;background:#F5C4B3;display:flex;align-items:center;justify-content:center;font-size:5px;color:#8B2500;font-weight:700">FT</div>'
        else if(t.t==='bs')cell+='<div style="position:absolute;inset:0;background:#FAC775;display:flex;align-items:center;justify-content:center;font-size:5px;color:#633806;font-weight:700">BS</div>'
        else if(t.t==='krank')cell+='<div style="position:absolute;inset:0;background:#FFEBEE;display:flex;align-items:center;justify-content:center;font-size:5px;color:#B71C1C;font-weight:700">Krank</div>'
        cell+='</div>'
        h+='<td style="padding:1px;border:0.3px solid #ccc;vertical-align:top">'+cell+'</td>'
        h+='<td style="padding:1px;border:0.3px solid #ccc;text-align:center">'+fH2(hh)+'</td>'
      })
      h+='<td style="padding:2px;border:0.3px solid #ccc;text-align:center;font-weight:700">'+fH2(wh)+'</td></tr>'
    })
    return h+'</tbody></table>'
  }
  var p1=tbl(maList.slice(0,mid),1),p2=tbl(maList.slice(mid),2)
  var st='<'+'script>window.addEventListener("load",function(){setTimeout(function(){window.print()},400)})<'+'/script>'
  var html='<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Helvetica,sans-serif}@page{size:A4 landscape;margin:6mm}.page{padding:6mm}@media print{.page{page-break-after:always}.page:last-child{page-break-after:avoid}}</style></head><body><div class="page">'+p1+'</div><div class="page">'+p2+'</div>'+st+'</body></html>'

function showBarPopup(event,maId,di){
  var ma=maList.find(function(m){return m.id==maId});if(!ma)return
  di=parseInt(di)
  var t=getEffectiveShift(curKW,ma.id,di)
  var hasAusn=!!getAusnahme(curKW,ma.id,di)
  var eid='bp_'+maId+'_'+di
  var ex=document.getElementById(eid);if(ex){ex.remove();return}
  var pop=document.createElement('div')
  pop.id=eid
  pop.style.cssText='position:fixed;z-index:9000;background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:16px;width:280px;max-height:90vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,0.2)'
  var bg=FARBEN[t.f]?FARBEN[t.f].bg:'#B5D4F4'
  var bg2=FARBEN[t.f2]?FARBEN[t.f2].bg:'#CECBF6'
  function normT(tt){if(!tt||tt.indexOf(':')<0)return'08:00';var p=tt.split(':');return p[0].padStart(2,'0')+':'+p[1].padStart(2,'0')}
  var s=normT(t.s),e=normT(t.e)
  var s2=t.s2?normT(t.s2):'13:00',e2=t.e2?normT(t.e2):'20:00'
  var bem=t.bem||'',bem2=t.bem2||''
  var has2=!!(t.s2&&t.e2)
  var currentStatus=t.t
  var farbenOpts=Object.keys(FARBEN).map(function(k){return'<option value="'+k+'"'+(t.f===k?' selected':'')+'>'+FARBEN[k].label+'</option>'}).join('')
  var farbenOpts2=Object.keys(FARBEN).map(function(k){return'<option value="'+k+'"'+((t.f2||'spaet')===k?' selected':'')+'>'+FARBEN[k].label+'</option>'}).join('')

  function updatePills(status){
    currentStatus=status
    ;['work','fz','url','ft','bs','krank','neutral'].forEach(function(ss){
      var pill=document.getElementById('pill_'+ss+'_'+eid)
      if(!pill)return
      var on=ss===status
      pill.style.background=on?'var(--accent)':'var(--bg2)'
      pill.style.color=on?'white':'var(--text2)'
      pill.style.borderColor=on?'var(--accent)':'var(--border)'
    })
    var tr=document.getElementById('tr_'+eid)
    if(tr)tr.style.display=(status==='work')?'block':'none'
  }

  var ausnBanner=hasAusn?'<div style="display:flex;align-items:center;gap:6px;background:#FFF8E1;border:1px solid #F5C518;border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:11px;color:#7B5800">⚠️ Ausnahme aktiv</div>':''

  // Mini-timeline helper
  var T0p=6,T1p=22,TRp=T1p-T0p
  function tf2p(tt){var p=(tt||'08:00').split(':').map(Number);return Math.max(0,Math.min(1,(p[0]+p[1]/60-T0p)/TRp))}
  function fr2t(f){f=Math.max(0,Math.min(1,f));var tot=T0p+f*TRp;var h=Math.floor(tot);var m=Math.round((tot-h)*60/15)*15;if(m>=60){h++;m=0}return(h<10?'0':'')+h+':'+(m<10?'0':'')+m}

  var curS=s,curE=e,curS2=s2,curE2=e2

  function makeTL(idPfx,cs,ce,bgCol){
    var ls=tf2p(cs)*100,lw=(tf2p(ce)-tf2p(cs))*100
    return '<div style="position:relative;height:36px;background:var(--bg3);border-radius:8px;touch-action:none;cursor:grab;user-select:none" id="tl_'+idPfx+'">'+
      '<div id="tlb_'+idPfx+'" style="position:absolute;left:'+ls+'%;width:'+lw+'%;height:100%;background:'+bgCol+';border-radius:8px;display:flex;align-items:center;justify-content:center">'+
      '<div id="tlhl_'+idPfx+'" style="position:absolute;left:0;top:0;width:10px;height:100%;background:rgba(0,0,0,0.2);border-radius:8px 0 0 8px;cursor:ew-resize"></div>'+
      '<span id="tlt_'+idPfx+'" style="font-size:11px;font-weight:700;color:#333;pointer-events:none">'+cs+' – '+ce+'</span>'+
      '<div id="tlhr_'+idPfx+'" style="position:absolute;right:0;top:0;width:10px;height:100%;background:rgba(0,0,0,0.2);border-radius:0 8px 8px 0;cursor:ew-resize"></div>'+
      '</div></div>'
  }

  var timeBlock=hasAusn
    ?'<div style="background:'+bg+';padding:8px 10px;border-radius:8px;margin-bottom:10px;opacity:0.8"><b style="font-size:13px;color:#333">'+s+' – '+e+'</b></div>'
    :'<div id="tr_'+eid+'" style="display:'+(t.t==='work'?'block':'none')+';margin-bottom:10px">'+
     '<div style="font-size:11px;color:var(--text2);margin-bottom:4px">1. Schicht</div>'+
     '<select id="tf_'+eid+'" style="width:100%;border:1px solid var(--border);background:var(--bg2);border-radius:6px;padding:4px;font-size:11px;color:var(--text);margin-bottom:6px">'+farbenOpts+'</select>'+
     makeTL('b1_'+eid,s,e,bg)+
     '<input id="bem_'+eid+'" type="text" value="'+bem.replace(/"/g,'&quot;')+'" placeholder="Aufgabe 1. Schicht..." style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg2);color:var(--text);font-size:12px;box-sizing:border-box;margin-top:6px">'+
     '<div style="border-top:1px solid var(--border);margin:10px 0"></div>'+
     '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
     '<span style="font-size:11px;font-weight:600;color:var(--text2)">2. Schicht</span>'+
     '<button id="tog2_'+eid+'" style="font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid '+(has2?'var(--danger)':'var(--accent)')+';background:'+(has2?'var(--danger-bg)':'var(--accent-bg)')+';color:'+(has2?'var(--danger)':'var(--accent)')+';cursor:pointer">'+(has2?'✕ entfernen':'+ hinzufügen')+'</button>'+
     '</div>'+
     '<div id="bar2wrap_'+eid+'" style="display:'+(has2?'block':'none')+'">'+
     '<select id="tf2_'+eid+'" style="width:100%;border:1px solid var(--border);background:var(--bg2);border-radius:6px;padding:4px;font-size:11px;color:var(--text);margin-bottom:6px">'+farbenOpts2+'</select>'+
     makeTL('b2_'+eid,s2,e2,bg2)+
     '<input id="bem2_'+eid+'" type="text" value="'+bem2.replace(/"/g,'&quot;')+'" placeholder="Aufgabe 2. Schicht..." style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg2);color:var(--text);font-size:12px;box-sizing:border-box;margin-top:6px">'+
     '</div></div>'

  var bemRow=hasAusn
    ?'<div style="font-size:11px;color:var(--text2);margin-bottom:4px">Aufgabe:</div>'+
     '<input id="bem_'+eid+'" type="text" value="'+bem.replace(/"/g,'&quot;')+'" placeholder="Aufgabe..." style="width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg2);color:var(--text);font-size:12px;margin-bottom:10px;box-sizing:border-box">'
    :''

  pop.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
    '<b style="font-size:14px">'+ma.name+'</b>'+
    '<button id="cls_'+eid+'" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>'+
    ausnBanner+
    '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">'+
    ['work','fz','url','ft','bs','krank','neutral'].map(function(ss){
      var lbl={work:'Arbeit',fz:'FZ',url:'Urlaub',ft:'FT',bs:'BS',krank:'Krank',neutral:'Neutral'}[ss]
      var on=t.t===ss
      return '<span id="pill_'+ss+'_'+eid+'" style="font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid '+(on?'var(--accent)':'var(--border)')+';background:'+(on?'var(--accent)':'var(--bg2)')+';color:'+(on?'white':'var(--text2)')+';cursor:pointer">'+lbl+'</span>'
    }).join('')+
    '</div>'+
    timeBlock+
    bemRow+
    '<div style="display:flex;gap:8px;margin-top:8px">'+
    '<button id="sav_'+eid+'" style="flex:1;padding:9px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">💾 Speichern</button>'+
    (hasAusn?'<button id="ausn_'+eid+'" style="padding:9px 10px;background:#FFF8E1;color:#7B5800;border:1px solid #F5C518;border-radius:8px;font-size:11px;cursor:pointer">Ausnahmen</button>':'')+'</div>'

  document.body.appendChild(pop)

  // Timeline drag logic
  function setupTL(pfx,getS,getE,setS,setE){
    var tlEl=document.getElementById('tl_'+pfx)
    var barEl=document.getElementById('tlb_'+pfx)
    var hlEl=document.getElementById('tlhl_'+pfx)
    var hrEl=document.getElementById('tlhr_'+pfx)
    var lblEl=document.getElementById('tlt_'+pfx)
    if(!tlEl||!barEl)return
    function updateBar(){
      var ls=tf2p(getS())*100,lw=(tf2p(getE())-tf2p(getS()))*100
      barEl.style.left=ls+'%';barEl.style.width=lw+'%'
      if(lblEl)lblEl.textContent=getS()+' – '+getE()
      // Update bg when farbe changes
      var fid=pfx.indexOf('b1_')>=0?'tf_'+eid:'tf2_'+eid
      var fEl=document.getElementById(fid)
      if(fEl){var fc=FARBEN[fEl.value];if(fc)barEl.style.background=fc.bg}
    }
    var dm=null,sx=0,ss='',se=''
    function getX(ev){return ev.touches?ev.touches[0].clientX:ev.clientX}
    function startD(mode,ev){ev.preventDefault();ev.stopPropagation();dm=mode;sx=getX(ev);ss=getS();se=getE()}
    function moveD(ev){
      if(!dm)return;ev.preventDefault()
      var rect=tlEl.getBoundingClientRect()
      var dx=(getX(ev)-sx)/rect.width
      if(dm==='move'){var w=tf2p(se)-tf2p(ss);var ns=Math.max(0,Math.min(1-w,tf2p(ss)+dx));setS(fr2t(ns));setE(fr2t(ns+w))}
      else if(dm==='left'){setS(fr2t(Math.max(0,Math.min(tf2p(getE())-1/16,tf2p(ss)+dx))))}
      else if(dm==='right'){setE(fr2t(Math.min(1,Math.max(tf2p(getS())+1/16,tf2p(se)+dx))))}
      updateBar()
    }
    function stopD(){dm=null}
    barEl.addEventListener('mousedown',function(ev){if(!ev.target.id||ev.target.id===barEl.id||ev.target===lblEl)startD('move',ev)})
    barEl.addEventListener('touchstart',function(ev){if(!ev.target.id||ev.target.id===barEl.id||ev.target===lblEl)startD('move',ev)},{passive:false})
    hlEl.addEventListener('mousedown',function(ev){ev.stopPropagation();startD('left',ev)})
    hlEl.addEventListener('touchstart',function(ev){ev.stopPropagation();startD('left',ev)},{passive:false})
    hrEl.addEventListener('mousedown',function(ev){ev.stopPropagation();startD('right',ev)})
    hrEl.addEventListener('touchstart',function(ev){ev.stopPropagation();startD('right',ev)},{passive:false})
    document.addEventListener('mousemove',moveD)
    document.addEventListener('touchmove',moveD,{passive:false})
    document.addEventListener('mouseup',stopD)
    document.addEventListener('touchend',stopD)
    // Update color on farbe change
    var fid=pfx.indexOf('b1_')>=0?'tf_'+eid:'tf2_'+eid
    var fEl=document.getElementById(fid)
    if(fEl)fEl.addEventListener('change',updateBar)
  }

  if(!hasAusn){
    setupTL('b1_'+eid,function(){return curS},function(){return curE},function(v){curS=v},function(v){curE=v})
    if(has2)setupTL('b2_'+eid,function(){return curS2},function(){return curE2},function(v){curS2=v},function(v){curE2=v})
    // Setup bar2 drag when added
    var tog2=document.getElementById('tog2_'+eid)
    if(tog2)tog2.addEventListener('click',function(){
      has2=!has2
      var wrap=document.getElementById('bar2wrap_'+eid)
      if(wrap)wrap.style.display=has2?'block':'none'
      tog2.textContent=has2?'✕ entfernen':'+ hinzufügen'
      tog2.style.borderColor=has2?'var(--danger)':'var(--accent)'
      tog2.style.color=has2?'var(--danger)':'var(--accent)'
      if(has2)setTimeout(function(){setupTL('b2_'+eid,function(){return curS2},function(){return curE2},function(v){curS2=v},function(v){curE2=v})},50)
    })
  }

  var vw=window.innerWidth||800,vh=window.innerHeight||600
  pop.style.left=Math.min(event.clientX+12,vw-300)+'px'
  pop.style.top=Math.min(event.clientY+12,vh-400)+'px'

  // Pills
  ;['work','fz','url','ft','bs','krank','neutral'].forEach(function(ss){
    var pill=document.getElementById('pill_'+ss+'_'+eid)
    if(pill)pill.addEventListener('click',function(ev){ev.stopPropagation();updatePills(ss)})
  })

  // Close
  document.getElementById('cls_'+eid).onclick=function(){pop.remove()}

  // Toggle 2nd bar - already handled in setupTL block above
  // Ausnahme button
  if(hasAusn){
    var ab=document.getElementById('ausn_'+eid)
    if(ab)ab.onclick=function(){showView('ausn');pop.remove()}
  }

  // Save
  document.getElementById('sav_'+eid).onclick=function(){
    var nb=document.getElementById('bem_'+eid)?document.getElementById('bem_'+eid).value:bem
    if(!hasAusn){
      if(currentStatus==='work'){
        var nb2=has2&&document.getElementById('bem2_'+eid)?document.getElementById('bem2_'+eid).value:''
        var nf=document.getElementById('tf_'+eid)?document.getElementById('tf_'+eid).value:(t.f||'blau')
        var nf2=document.getElementById('tf2_'+eid)?document.getElementById('tf2_'+eid).value:(t.f2||'spaet')
        setShift(curKW,ma.id,di,{t:'work',s:curS,e:curE,f:nf,bem:nb,s2:has2?curS2:null,e2:has2?curE2:null,f2:nf2,bem2:nb2})
      } else {
        setShift(curKW,ma.id,di,{t:currentStatus,bem:nb})
      }
    } else {
      var ai=ausnahmen[curKW]?ausnahmen[curKW].findIndex(function(a){return a.maId==ma.id&&a.dayIdx==di}):-1
      if(ai>=0)ausnahmen[curKW][ai].bem=nb
    }
    saveState();renderWoche();if(curDay===di)renderTag();renderConflicts();pop.remove()
  }

  setTimeout(function(){
    function oc(ev){if(!pop.contains(ev.target)){pop.remove();document.removeEventListener('click',oc)}}
    document.addEventListener('click',oc)
  },150)
}

window.settings={minBesetzung:{mo:{frueh:3,spaet:1},di:{frueh:3,spaet:1},mi:{frueh:3,spaet:1},do:{frueh:3,spaet:1},fr:{frueh:3,spaet:1},sa:{frueh:2,spaet:1}}}


var maTouchDrag={active:false,maId:null,lastY:0}
function maTouchStart(e,maId){
  e.preventDefault();e.stopPropagation()
  maTouchDrag={active:true,maId:maId,lastY:e.touches[0].clientY}
  var card=e.currentTarget;card.style.opacity='0.5'
}
function maTouchMove(e){
  if(!maTouchDrag.active)return;e.preventDefault()
  maTouchDrag.lastY=e.touches[0].clientY
  var els=document.elementsFromPoint(e.touches[0].clientX,e.touches[0].clientY)
  document.querySelectorAll('.ma-card').forEach(function(c){c.style.borderTop=''})
  for(var i=0;i<els.length;i++){
    var card=els[i].closest?els[i].closest('.ma-card'):null
    if(card&&card.dataset.id!=maTouchDrag.maId){card.style.borderTop='2px solid var(--accent)';break}
  }
}
function maTouchEnd(e){
  if(!maTouchDrag.active)return
  var touch=e.changedTouches[0]
  var els=document.elementsFromPoint(touch.clientX,touch.clientY)
  document.querySelectorAll('.ma-card').forEach(function(c){c.style.opacity='';c.style.borderTop=''})
  for(var i=0;i<els.length;i++){
    var card=els[i].closest?els[i].closest('.ma-card'):null
    if(card&&card.dataset.id!=maTouchDrag.maId){
      var fromIdx=maList.findIndex(function(m){return m.id==maTouchDrag.maId})
      var toIdx=parseInt(card.dataset.idx)
      if(fromIdx>=0&&toIdx>=0&&fromIdx!==toIdx){
        var moved=maList.splice(fromIdx,1)[0]
        maList.splice(toIdx,0,moved)
        saveState();renderMA()
      }
      break
    }
  }
  maTouchDrag={active:false,maId:null,lastY:0}
}
document.addEventListener('touchmove',function(e){if(maTouchDrag.active)maTouchMove(e)},{passive:false})
document.addEventListener('touchend',function(e){if(maTouchDrag.active)maTouchEnd(e)})

// Init
loadState()
renderAll()
</script>
